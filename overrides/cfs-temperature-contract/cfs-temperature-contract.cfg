# Original overlay for the rooted K1 Max + classic CFS.
# Candidate G4-CFS-TEMP-PLA. Do not deploy without the named gate.

[gcode_macro CFS_TEMP_CONTRACT]
variable_active: 0
variable_first_temp: 0.0
variable_normal_temp: 0.0
variable_saved_target: 0.0
variable_refill_pending: 0
variable_guard_ticks: 0
variable_static_cfs_temp: 195.0
gcode:
  {action_respond_info("CFS temperature contract: active=%d first=%.1f normal=%.1f saved=%.1f pending=%d" % (
    printer['gcode_macro CFS_TEMP_CONTRACT'].active|int,
    printer['gcode_macro CFS_TEMP_CONTRACT'].first_temp|float,
    printer['gcode_macro CFS_TEMP_CONTRACT'].normal_temp|float,
    printer['gcode_macro CFS_TEMP_CONTRACT'].saved_target|float,
    printer['gcode_macro CFS_TEMP_CONTRACT'].refill_pending|int))}

[gcode_macro CFS_TEMP_CONTRACT_START]
gcode:
  {% set material = params.MATERIAL|default('UNSET')|string|upper %}
  {% set first = params.FIRST_TEMP|default(0)|float %}
  {% set normal = params.NORMAL_TEMP|default(0)|float %}
  {% if material != 'GEEETECH_PLA' %}
    {action_raise_error("CFS contract refused: CFS_MATERIAL=GEEETECH_PLA is required")}
  {% endif %}
  {% if (first - 190.0)|abs > 0.1 or (normal - 195.0)|abs > 0.1 %}
    {action_raise_error("CFS contract refused: this candidate only accepts FIRST=190 and NORMAL=195")}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=CFS_TEMP_CONTRACT_GUARD DURATION=0
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=active VALUE=1
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=first_temp VALUE={first}
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=normal_temp VALUE={normal}
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=saved_target VALUE=0.0
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=refill_pending VALUE=0
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=guard_ticks VALUE=0
  {action_respond_info("CFS contract accepted: Geeetech PLA, first 190 C, normal 195 C")}

[gcode_macro CFS_TEMP_CONTRACT_PAUSE]
gcode:
  {% set state = printer['gcode_macro CFS_TEMP_CONTRACT'] %}
  {% if state.active|int == 1 and printer.box.enable|int == 1 and printer.box.auto_refill|int == 1 and printer.box.filament_useup|int == 1 %}
    {% set target = printer.extruder.target|float %}
    {% if target < 180.0 or target > 205.0 %}
      {% set target = state.normal_temp|float %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=saved_target VALUE={target}
    SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=refill_pending VALUE=1
    SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=guard_ticks VALUE=0
    {action_respond_info("CFS automatic refill: saved nozzle target %.1f C" % target)}
  {% endif %}

[gcode_macro CFS_TEMP_CONTRACT_ARM_GUARD]
gcode:
  {% set state = printer['gcode_macro CFS_TEMP_CONTRACT'] %}
  {% set desired = state.saved_target|float %}
  {% set static = state.static_cfs_temp|float %}
  {% if state.active|int == 1 and state.refill_pending|int == 1 %}
    {% if desired >= 180.0 and desired <= 205.0 and (desired - static)|abs > 0.5 %}
      SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=guard_ticks VALUE=0
      UPDATE_DELAYED_GCODE ID=CFS_TEMP_CONTRACT_GUARD DURATION=0.25
    {% else %}
      SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=refill_pending VALUE=0
    {% endif %}
  {% endif %}

[delayed_gcode CFS_TEMP_CONTRACT_GUARD]
gcode:
  {% set state = printer['gcode_macro CFS_TEMP_CONTRACT'] %}
  {% set desired = state.saved_target|float %}
  {% set static = state.static_cfs_temp|float %}
  {% set current = printer.extruder.target|float %}
  {% set ticks = state.guard_ticks|int %}
  {% if state.active|int == 1 and state.refill_pending|int == 1 %}
    {% if (current - static)|abs <= 0.5 %}
      M104 S{desired}
      SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=refill_pending VALUE=0
      SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=guard_ticks VALUE=0
      {action_respond_info("CFS automatic refill: restored nozzle target %.1f C after tool replay" % desired)}
    {% elif ticks < 12 %}
      SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=guard_ticks VALUE={ticks + 1}
      UPDATE_DELAYED_GCODE ID=CFS_TEMP_CONTRACT_GUARD DURATION=0.25
    {% else %}
      SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=refill_pending VALUE=0
      SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=guard_ticks VALUE=0
      {action_respond_info("CFS automatic refill: no 195 C tool replay observed; guard stopped")}
    {% endif %}
  {% endif %}

[gcode_macro CFS_TEMP_CONTRACT_CLEAR]
gcode:
  UPDATE_DELAYED_GCODE ID=CFS_TEMP_CONTRACT_GUARD DURATION=0
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=first_temp VALUE=0.0
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=normal_temp VALUE=0.0
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=saved_target VALUE=0.0
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=refill_pending VALUE=0
  SET_GCODE_VARIABLE MACRO=CFS_TEMP_CONTRACT VARIABLE=guard_ticks VALUE=0
