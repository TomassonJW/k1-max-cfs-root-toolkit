# G4-ZSAFE-START-V1
# K1 Max S12 structure 0 / firmware 2.3.5.34.
# Candidate only: loading this file does not authorise deployment.

[save_variables]
filename: /usr/data/printer_data/config/zsafe_g4_variables.cfg

[gcode_macro ZSAFE_STATE]
variable_clean_ready: 0
variable_reference_ready: 0
variable_mesh_ready: 0
variable_correction_ready: 0
variable_low_moves_armed: 0
variable_authorized_z_correction: 0.27
variable_correction_tolerance: 0.0005
gcode:
  {action_respond_info("ZSAFE state holder")}

[gcode_macro ZSAFE_CONFIRM_NOZZLE_CLEAN]
description: Human confirmation that the nozzle was cleaned before this one start
gcode:
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=clean_ready VALUE=1
  {action_respond_info("ZSAFE: manual nozzle-clean confirmation accepted for one start")}

[gcode_macro ZSAFE_DISARM]
gcode:
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=clean_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=reference_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=mesh_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=correction_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=low_moves_armed VALUE=0

[gcode_macro ZSAFE_FINAL_REFERENCE]
gcode:
  ACCURATE_G28
  ZSAFE_MARK_REFERENCE_READY

[gcode_macro ZSAFE_MARK_REFERENCE_READY]
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("ZSAFE: final XYZ reference is not confirmed")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=reference_ready VALUE=1

[gcode_macro ZSAFE_LOAD_MESH]
gcode:
  {% set profile = params.PROFILE|default("default")|string %}
  {% if profile != "default" %}
    {action_raise_error("ZSAFE: only the reviewed default mesh is authorised")}
  {% endif %}
  BED_MESH_PROFILE LOAD={profile}
  ZSAFE_MARK_MESH_READY PROFILE={profile}

[gcode_macro ZSAFE_MARK_MESH_READY]
gcode:
  {% set profile = params.PROFILE|default("default")|string %}
  {% if printer.bed_mesh.profile_name|string != profile %}
    {action_raise_error("ZSAFE: requested mesh profile is not active")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=mesh_ready VALUE=1

[gcode_macro ZSAFE_APPLY_CORRECTION]
gcode:
  {% set requested = params.Z|float %}
  {% set authorised = printer["gcode_macro ZSAFE_STATE"].authorized_z_correction|float %}
  {% set tolerance = printer["gcode_macro ZSAFE_STATE"].correction_tolerance|float %}
  {% if (requested - authorised)|abs > tolerance %}
    {action_raise_error("ZSAFE: requested Z correction is outside this reviewed package")}
  {% endif %}
  SET_GCODE_OFFSET Z={requested} MOVE=0
  ZSAFE_MARK_CORRECTION_READY Z={requested}

[gcode_macro ZSAFE_MARK_CORRECTION_READY]
gcode:
  {% set requested = params.Z|float %}
  {% set actual = printer.gcode_move.homing_origin.z|float %}
  {% set tolerance = printer["gcode_macro ZSAFE_STATE"].correction_tolerance|float %}
  {% if (actual - requested)|abs > tolerance %}
    {action_raise_error("ZSAFE: effective Z correction does not match the reviewed value")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=correction_ready VALUE=1

[gcode_macro ZSAFE_ARM_LOW_MOVES]
gcode:
  {% set state = printer["gcode_macro ZSAFE_STATE"] %}
  {% set authorised = state.authorized_z_correction|float %}
  {% set actual = printer.gcode_move.homing_origin.z|float %}
  {% set tolerance = state.correction_tolerance|float %}
  {% if state.reference_ready|int != 1 %}
    {action_raise_error("ZSAFE: final Z reference is missing")}
  {% endif %}
  {% if state.mesh_ready|int != 1 or printer.bed_mesh.profile_name|string != "default" %}
    {action_raise_error("ZSAFE: reviewed mesh is not active")}
  {% endif %}
  {% if state.correction_ready|int != 1 or (actual - authorised)|abs > tolerance %}
    {action_raise_error("ZSAFE: effective Z correction is not armed")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=ZSAFE_STATE VARIABLE=low_moves_armed VALUE=1
  {action_respond_info("ZSAFE: low moves armed after final reference, mesh and correction")}

[gcode_macro ZSAFE_ASSERT_ARMED]
gcode:
  {% set state = printer["gcode_macro ZSAFE_STATE"] %}
  {% set authorised = state.authorized_z_correction|float %}
  {% set actual = printer.gcode_move.homing_origin.z|float %}
  {% set tolerance = state.correction_tolerance|float %}
  {% if state.low_moves_armed|int != 1 %}
    {action_raise_error("ZSAFE: purge or low movement refused because the safety gate is closed")}
  {% endif %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("ZSAFE: purge or low movement refused because axes are not referenced")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != "default" %}
    {action_raise_error("ZSAFE: purge or low movement refused because the mesh changed")}
  {% endif %}
  {% if (actual - authorised)|abs > tolerance %}
    {action_raise_error("ZSAFE: purge or low movement refused because the Z correction changed")}
  {% endif %}

[gcode_macro ZSAFE_SAFE_CFS_AND_PURGE]
gcode:
  {% set initial_tool = params.INITIAL_TOOL|int %}
  {% set extruder_temp = params.EXTRUDER_TEMP|float %}
  {% set bed_temp = params.BED_TEMP|float %}
  {% set correction = params.Z_CORRECTION|float %}
  {% if initial_tool < 0 or initial_tool > 7 %}
    {action_raise_error("ZSAFE: initial tool must be between T0 and T7 for this package")}
  {% endif %}
  ZSAFE_ASSERT_ARMED
  BOX_START_PRINT
  T{initial_tool}
  BOX_START_PRINT_EXTRUDE_MATERIAL START_PRINT=8
  {% if printer.box.enable|int == 1 %}
    M109 S{extruder_temp}
  {% endif %}
  ZSAFE_APPLY_CORRECTION Z={correction}
  ZSAFE_ARM_LOW_MOVES
  ZSAFE_DRAW_LINE EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp}

[gcode_macro ZSAFE_DRAW_LINE]
gcode:
  {% set need_retraction = 0 %}
  {% if printer.box.enable|int == 1 %}
    {% set need_retraction = 12 %}
  {% endif %}
  ZSAFE_ASSERT_ARMED
  CX_PRINT_DRAW_ONE_LINE EXTRUDER_TEMP={params.EXTRUDER_TEMP} BED_TEMP={params.BED_TEMP} NEED_G28=0 NEED_RETRACTION={need_retraction}

[gcode_macro ZSAFE_VALIDATE_HIGH]
description: Future G4 validation only; no tool selection and no extrusion
gcode:
  ZSAFE_ASSERT_ARMED
  G90
  G1 Z30 F600
  {action_respond_info("ZSAFE: high-clearance validation reached Z30 without CFS or extrusion")}

# This duplicate section is intentionally loaded after gcode_macro.cfg. The
# captured Klipper uses RawConfigParser(strict=False), so this gcode value
# replaces the stock START_PRINT body while the vendor file remains untouched.
[gcode_macro START_PRINT]
variable_prepare: 0
gcode:
  {% set bed_temp = params.BED_TEMP|default(printer.custom_macro.default_bed_temp)|float %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(printer.custom_macro.default_extruder_temp)|float %}
  {% set initial_tool = params.INITIAL_TOOL|default(0)|int %}
  {% set correction = params.Z_CORRECTION|default(0.27)|float %}
  {% set validate_only = params.VALIDATE_ONLY|default(0)|int %}
  {% if printer["gcode_macro ZSAFE_STATE"].clean_ready|int != 1 %}
    {action_raise_error("ZSAFE: run ZSAFE_CONFIRM_NOZZLE_CLEAN after manual cleaning")}
  {% endif %}
  ZSAFE_DISARM
  G90
  WAIT_TEMP_END
  CLEAR_PAUSE
  PRINT_PREPARE_CLEAR
  CX_ROUGH_G28 EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp}
  ZSAFE_FINAL_REFERENCE
  ZSAFE_LOAD_MESH PROFILE=default
  ZSAFE_APPLY_CORRECTION Z={correction}
  ZSAFE_ARM_LOW_MOVES
  {% if validate_only == 1 %}
    ZSAFE_VALIDATE_HIGH
  {% else %}
    M140 S{bed_temp}
    M104 S{extruder_temp}
    ZSAFE_SAFE_CFS_AND_PURGE INITIAL_TOOL={initial_tool} EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} Z_CORRECTION={correction}
  {% endif %}

[gcode_macro ZSAFE_CAPTURE_CORRECTION_CANDIDATE]
gcode:
  {% set candidate = printer.gcode_move.homing_origin.z|float %}
  SAVE_VARIABLE VARIABLE=zsafe_correction_candidate VALUE={candidate}
  {action_respond_info("ZSAFE: final correction candidate captured before stock/UI cleanup: %.3f mm" % candidate)}

[gcode_macro ZSAFE_END_PRINT]
description: Capture the final correction before calling the unchanged stock end macro
gcode:
  ZSAFE_CAPTURE_CORRECTION_CANDIDATE
  ZSAFE_DISARM
  END_PRINT
