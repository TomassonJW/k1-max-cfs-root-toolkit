# K1 Control - ceilings on the nozzle temperature, and the M104/M109 wrappers
# that enforce them.
#
# Two windows live here, and they never overlap. The probing window refuses a
# target above its ceiling, because a contact taken on an oozing nozzle is
# worthless and a refusal is the only honest answer. The CFS loading window
# lowers it instead, because the stock loader asks for the material database
# temperature - 220 C for every PLA - in the middle of a print that must not
# die for it. See docs/67.
#
# They share one file because Klipper merges sections of the same name: a
# second [gcode_macro M104] in another file would overwrite this one and its
# rename_existing would then find nothing (key169, seen on 2026-09-02).
#
# First half - hard ceiling on the nozzle temperature while probing
#
# A hot nozzle oozes onto the plate and falsifies every contact that follows.
# Monitoring only reports the damage after the fact, so the ceiling is enforced
# at the command layer instead: M104 and M109 are wrapped and refuse any target
# above the ceiling while the probing window is open.
#
# This catches every caller that goes through the G-code dispatcher, including
# the compiled Creality modules, because they issue their temperatures with
# run_script_from_command. It cannot catch a module that calls the heater API
# directly in Python; no configuration can.

[gcode_macro _KCTRL_PROBE_GUARD]
description: State of the probing temperature ceiling
variable_active: 0
variable_ceiling: 0.0
gcode:
  {% set g = printer["gcode_macro _KCTRL_PROBE_GUARD"] %}
  {% if g.active|int == 1 %}
    {action_respond_info("K1 Control: probing window OPEN, nozzle targets above %.0f C are refused" % g.ceiling|float)}
  {% else %}
    {action_respond_info("K1 Control: probing window closed, no ceiling in force")}
  {% endif %}

[gcode_macro _KCTRL_PROBE_GUARD_ON]
description: Open the probing window and hold the nozzle below CEILING
gcode:
  {% set ceiling = params.CEILING|float %}
  {% if ceiling < 60.0 or ceiling > 320.0 %}
    {action_raise_error("K1 Control: probing ceiling must be 60..320 C")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_KCTRL_PROBE_GUARD VARIABLE=ceiling VALUE={ceiling}
  SET_GCODE_VARIABLE MACRO=_KCTRL_PROBE_GUARD VARIABLE=active VALUE=1
  {action_respond_info("K1 Control: probing window open, nozzle ceiling %.0f C" % ceiling)}
  # Capping the setpoint is not enough. A nozzle left hot by a previous job, a
  # manual purge or an aborted load is still hot when the window opens, and the
  # bed soak is far too short to cool it: the contact would then be taken on a
  # nozzle that oozes onto the plate, which is exactly what the ceiling exists
  # to prevent. Found on 2026-09-01 with the nozzle at 244 C and the target
  # already back to zero, so nothing in the sequence would have caught it.
  #
  # A setpoint above the ceiling gets the same treatment, and this window is the
  # only reason it can: every caller owns the sequence it is about to probe in,
  # and every one of them sets the printing temperature again afterwards, so a
  # target still standing here is a leftover - a tool load and its purge fired
  # by the slicer, an aborted job - and never an instruction worth keeping.
  # Refusing it instead was measured on 2026-09-05: three prints in a row died
  # at the same byte because the sliced file had purged at 220 C before
  # START_PRINT, and no file already sliced could ever have started again.
  {% if printer.extruder.target|float > ceiling %}
    {action_respond_info("K1 Control: cible buse %.0f C encore posee avant le contact, coupee; la temperature d'impression est reglee apres le palpage" % printer.extruder.target|float)}
  {% endif %}
  {% if printer.extruder.temperature|float > ceiling %}
    {action_respond_info("K1 Control: nozzle at %.0f C, holding until it falls below %.0f C; no contact before that" % (printer.extruder.temperature|float, ceiling))}
  {% endif %}
  M104 S0
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ceiling}

[gcode_macro _KCTRL_PROBE_GUARD_OFF]
description: Close the probing window
gcode:
  SET_GCODE_VARIABLE MACRO=_KCTRL_PROBE_GUARD VARIABLE=active VALUE=0
  {action_respond_info("K1 Control: probing window closed")}

# Second half - soft ceiling on the nozzle temperature while the CFS loads
#
# The stock loader does not take its temperature from the sliced file. It reads
# the material type of the slot it is about to pull from, looks that identifier
# up in creality/userdata/box/material_database.json, and heats to the
# nozzle_temperature of that record. Generic PLA carries 220 C, so every PLA
# load has always heated to 220 C whatever the G-code asked for. Proved on
# 2026-09-09: the same load logged max_volumetric_speed: 14, which is the
# filament_max_volumetric_speed of that same record, while the sliced file
# carried 23,24. See docs/67.
#
# The database is corrected to a sane loading temperature per material, and
# that correction is the fix. This window is the net under it: a firmware
# update that restores the database, a slot whose material record we never
# reviewed, or a Creality path we have not read still cannot push the nozzle
# more than a few degrees above what the G-code asked for.
#
# It lowers rather than refuses. Refusing here would kill the print at the
# load, which is exactly the failure mode removed on 2026-09-05, and the CFS
# has no reason of its own to be at 220 C - the melt zone only has to be hot
# enough to push and to purge.
#
# The window is opened by START_PRINT around its CFS block only. It is
# deliberately not left armed for the whole print: a job with two filaments at
# two temperatures needs the second one to be able to go higher than the first.
[gcode_macro _KCTRL_LOAD_GUARD]
description: State of the CFS loading temperature ceiling
variable_active: 0
variable_ceiling: 0.0
gcode:
  {% set l = printer["gcode_macro _KCTRL_LOAD_GUARD"] %}
  {% if l.active|int == 1 %}
    {action_respond_info("K1 Control: fenetre de chargement CFS OUVERTE, toute cible buse au dessus de %.0f C est ramenee a ce plafond" % l.ceiling|float)}
  {% else %}
    {action_respond_info("K1 Control: fenetre de chargement CFS fermee, aucun plafond en vigueur")}
  {% endif %}

[gcode_macro _KCTRL_LOAD_GUARD_ON]
description: Open the CFS loading window and cap the nozzle at CEILING
gcode:
  {% set ceiling = params.CEILING|float %}
  {% if ceiling < 60.0 or ceiling > 320.0 %}
    {action_raise_error("K1 Control: le plafond de chargement doit etre entre 60 et 320 C")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_KCTRL_LOAD_GUARD VARIABLE=ceiling VALUE={ceiling}
  SET_GCODE_VARIABLE MACRO=_KCTRL_LOAD_GUARD VARIABLE=active VALUE=1
  {action_respond_info("K1 Control: fenetre de chargement CFS ouverte, plafond buse %.0f C" % ceiling)}

[gcode_macro _KCTRL_LOAD_GUARD_OFF]
description: Close the CFS loading window
gcode:
  SET_GCODE_VARIABLE MACRO=_KCTRL_LOAD_GUARD VARIABLE=active VALUE=0
  {action_respond_info("K1 Control: fenetre de chargement CFS fermee")}

# The two windows are read in order: the probing one refuses, the loading one
# lowers. A target at or below both ceilings goes through untouched, which is
# every target in a normal print.
#
# When the loading window lowers a target, the other parameters of the command
# are dropped rather than replayed. The only caller this ever applies to is the
# stock loader, and it sends a bare S.
[gcode_macro M104]
rename_existing: M104.1
description: Set nozzle temperature, refused while probing, capped while the CFS loads
gcode:
  {% set g = printer["gcode_macro _KCTRL_PROBE_GUARD"] %}
  {% set l = printer["gcode_macro _KCTRL_LOAD_GUARD"] %}
  {% if g.active|int == 1 and params.S is defined and params.S|float > g.ceiling|float %}
    {action_raise_error("K1 Control: M104 S%.0f refused, the probing window caps the nozzle at %.0f C" % (params.S|float, g.ceiling|float))}
  {% endif %}
  {% if l.active|int == 1 and params.S is defined and params.S|float > l.ceiling|float %}
    {action_respond_info("K1 Control: M104 S%.0f pendant le chargement CFS, ramene a %.0f C" % (params.S|float, l.ceiling|float))}
    M104.1 S{l.ceiling|float}
  {% else %}
    M104.1 {rawparams}
  {% endif %}

[gcode_macro M109]
rename_existing: M109.1
description: Set and wait nozzle temperature, refused while probing, capped while the CFS loads
gcode:
  {% set g = printer["gcode_macro _KCTRL_PROBE_GUARD"] %}
  {% set l = printer["gcode_macro _KCTRL_LOAD_GUARD"] %}
  {% if g.active|int == 1 and params.S is defined and params.S|float > g.ceiling|float %}
    {action_raise_error("K1 Control: M109 S%.0f refused, the probing window caps the nozzle at %.0f C" % (params.S|float, g.ceiling|float))}
  {% endif %}
  {% if l.active|int == 1 and params.S is defined and params.S|float > l.ceiling|float %}
    {action_respond_info("K1 Control: M109 S%.0f pendant le chargement CFS, ramene a %.0f C" % (params.S|float, l.ceiling|float))}
    M109.1 S{l.ceiling|float}
  {% else %}
    M109.1 {rawparams}
  {% endif %}
