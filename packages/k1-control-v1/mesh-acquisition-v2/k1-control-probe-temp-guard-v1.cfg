# K1 Control - hard ceiling on the nozzle temperature while probing
#
# A hot nozzle oozes onto the plate and falsifies every contact that follows.
# Monitoring only reports the damage after the fact, so the ceiling is enforced
# at the command layer instead: M104 and M109 are wrapped and refuse any target
# above the ceiling while the probing window is open.
#
# This catches every caller that goes through the G-code dispatcher, including
# the compiled Creality modules, because they issue their temperatures with
# run_script_from_command. It cannot catch a module that calls the heater API
# directly in Python; no configuration can.

[gcode_macro KCTRL_PROBE_GUARD]
description: State of the probing temperature ceiling
variable_active: 0
variable_ceiling: 0.0
gcode:
  {% set g = printer["gcode_macro KCTRL_PROBE_GUARD"] %}
  {% if g.active|int == 1 %}
    {action_respond_info("K1 Control: probing window OPEN, nozzle targets above %.0f C are refused" % g.ceiling|float)}
  {% else %}
    {action_respond_info("K1 Control: probing window closed, no ceiling in force")}
  {% endif %}

[gcode_macro KCTRL_PROBE_GUARD_ON]
description: Open the probing window and refuse any nozzle target above CEILING
gcode:
  {% set ceiling = params.CEILING|float %}
  {% if ceiling < 60.0 or ceiling > 320.0 %}
    {action_raise_error("K1 Control: probing ceiling must be 60..320 C")}
  {% endif %}
  {% if printer.extruder.target|float > ceiling %}
    {action_raise_error("K1 Control: the nozzle is already targeting %.0f C, above the %.0f C probing ceiling" % (printer.extruder.target|float, ceiling))}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_PROBE_GUARD VARIABLE=ceiling VALUE={ceiling}
  SET_GCODE_VARIABLE MACRO=KCTRL_PROBE_GUARD VARIABLE=active VALUE=1
  {action_respond_info("K1 Control: probing window open, nozzle ceiling %.0f C" % ceiling)}

[gcode_macro KCTRL_PROBE_GUARD_OFF]
description: Close the probing window
gcode:
  SET_GCODE_VARIABLE MACRO=KCTRL_PROBE_GUARD VARIABLE=active VALUE=0
  {action_respond_info("K1 Control: probing window closed")}

[gcode_macro M104]
rename_existing: M104.1
description: Set nozzle temperature, refused above the ceiling while probing
gcode:
  {% set g = printer["gcode_macro KCTRL_PROBE_GUARD"] %}
  {% if g.active|int == 1 and params.S is defined and params.S|float > g.ceiling|float %}
    {action_raise_error("K1 Control: M104 S%.0f refused, the probing window caps the nozzle at %.0f C" % (params.S|float, g.ceiling|float))}
  {% endif %}
  M104.1 {rawparams}

[gcode_macro M109]
rename_existing: M109.1
description: Set and wait nozzle temperature, refused above the ceiling while probing
gcode:
  {% set g = printer["gcode_macro KCTRL_PROBE_GUARD"] %}
  {% if g.active|int == 1 and params.S is defined and params.S|float > g.ceiling|float %}
    {action_raise_error("K1 Control: M109 S%.0f refused, the probing window caps the nozzle at %.0f C" % (params.S|float, g.ceiling|float))}
  {% endif %}
  M109.1 {rawparams}
