# K1 Control - one button to turn four acquired quadrants into the reference
# mesh profile of a bed temperature band.
#
# The merge itself lives in the kctrl_mesh Klipper module because it needs
# matrix work and a file write that a Jinja macro cannot do: per quadrant bias
# estimation on the shared junction, normalisation to zero at the probing point
# (ADR-046), and a direct write into the autosave block of printer.cfg rather
# than SAVE_CONFIG, which on this machine would commit unrelated pending state.

[kctrl_mesh]
# Bed screw geometry. M4 thread, 0.7 mm per turn, so one eighth is 0.0875 mm.
#
# These positions are measured on this machine, not taken from a community
# config: with the plate removed, Thomas parked the nozzle over each screw and
# signalled it with a 1 mm move in Z while the toolhead position was recorded.
# The layout is markedly asymmetric - the front pair spans 258 mm, the rear
# pair only 198 mm and sits off centre - which is why guessed coordinates were
# not good enough. A 20 mm error would cost 0.05 mm of correction on a bed
# tilted 0.7 mm end to end, the size of the error being chased.
screw_pitch: 0.7
screw1: 18.5, 23.7
screw1_name: avant-gauche
screw2: 276.5, 23.7
screw2_name: avant-droit
screw3: 48.5, 273.7
screw3_name: arriere-gauche
screw4: 246.5, 273.7
screw4_name: arriere-droit

[gcode_macro KCTRL_BED_SCREWS]
description: Probe a 3x3 grid and report how far to turn each bed screw
gcode:
  {% set c = printer["gcode_macro _KCTRL_START_CONF"] %}
  {% set bed = params.BED_TEMP|default(55)|float %}
  {% set soak = params.SOAK_SECONDS|default(c.soak_seconds)|int %}
  {% set park = params.PARK_Z|default(90)|float %}
  {% set contact = c.probe_contact_c|float %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: bed screw measurement requires standby")}
  {% endif %}
  {% if printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    {action_raise_error("K1 Control: filament is still engaged in the head; retract it and clean the nozzle before probing")}
  {% endif %}
  {action_respond_info("K1 Control: measuring the bed plane at %d C, contact %d C" % (bed|round|int, contact|int))}
  G90
  M140 S{bed}
  M190 S{bed}
  G4 P{soak * 1000}
  _KCTRL_PROBE_GUARD_ON CEILING={contact + 5.0}
  CX_ROUGH_G28 EXTRUDER_TEMP={contact + 90.0} BED_TEMP={bed}
  ACCURATE_G28
  _KCTRL_PROBE_GUARD_OFF
  BED_MESH_CLEAR
  # Twenty five contacts, still under the 36 the probe allows in one sequence.
  # Four would only give a plane; this also measures how far the bed departs
  # from one, and gives the screw heights enough neighbours to be interpolated
  # rather than guessed. A warped bed cannot be screwed flat and Thomas needs
  # to know that before spending an evening on it.
  BED_MESH_CALIBRATE PROFILE=K1_SCREWS MESH_MIN=18,23 MESH_MAX=277,274 PROBE_COUNT=5,5 ALGORITHM=lagrange
  BED_MESH_CLEAR
  KCTRL_SCREWS_REPORT PROFILE=K1_SCREWS
  TURN_OFF_HEATERS
  # Drop the bed so the screws are reachable without fighting the toolhead.
  G90
  G1 Z{park} F1200
  {action_respond_info("K1 Control: bed lowered to Z%d, heaters off. Adjust, then run this again." % park|int)}


[gcode_macro KCTRL_MESH_SAVE_AS_REF]
description: Merge the acquired quadrants into the reference profile of a band and reload
gcode:
  {% set c = printer["gcode_macro _KCTRL_START_CONF"] %}
  {% set bed = params.BED_TEMP|float %}
  {% set band = bed|round|int %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: saving a reference mesh requires standby")}
  {% endif %}
  KCTRL_MESH_MERGE BED_TEMP={band} PLATE={c.plate_id|int} PROBE_REV={c.probe_rev|int}
  {action_respond_info("K1 Control: reloading so the new reference takes effect")}
  FIRMWARE_RESTART

[gcode_macro KCTRL_MESH_CALIBRATE]
description: One click - probe the bed, merge, store as the reference of the band, reload
gcode:
  {% set c = printer["gcode_macro _KCTRL_START_CONF"] %}
  {% set bed = params.BED_TEMP|default(55)|float %}
  {% set band = bed|round|int %}
  {% set soak = params.SOAK_SECONDS|default(c.soak_seconds)|int %}
  # Every guard lives in the acquisition, which refuses to probe unless the
  # machine is idle and the head is empty. A rejected merge leaves the
  # quadrants in place so a bad run can still be inspected.
  KCTRL_MESH_ACQUIRE BED_TEMP={band} SOAK_SECONDS={soak}
  KCTRL_MESH_MERGE BED_TEMP={band} PLATE={c.plate_id|int} PROBE_REV={c.probe_rev|int}
  {action_respond_info("K1 Control: band %d C calibrated and stored. Reloading; the heaters go to zero." % band)}
  FIRMWARE_RESTART

[gcode_macro KCTRL_MESH_REF_SHOW]
description: Print the reference mesh of a band as a readable map
gcode:
  {% set c = printer["gcode_macro _KCTRL_START_CONF"] %}
  {% set band = params.BED_TEMP|float|round|int %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (c.plate_id|int, band, c.probe_rev|int, c.x_count|int, c.y_count|int) %}
  KCTRL_MESH_SHOW PROFILE={profile}

[gcode_macro KCTRL_Z_REPEAT]
description: Check whether the Z reference drifts during normal mesh motion
gcode:
  {% set c = printer["gcode_macro _KCTRL_START_CONF"] %}
  {% set bed = params.BED_TEMP|default(55)|float %}
  {% set rounds = params.ROUNDS|default(4)|int %}
  {% set contact = c.probe_contact_c|float %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: the Z repeatability check requires standby")}
  {% endif %}
  {% if printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    {action_raise_error("K1 Control: filament is still engaged in the head; retract it and clean the nozzle before probing")}
  {% endif %}
  # A 2.78 mm jump appeared between two consecutive contacts of a mesh, then
  # every later contact stayed coherent 2.78 mm away. That is the Z reference
  # moving, not the bed. This reproduces the same motion and probes one fixed
  # point between each lap, so a drift shows up as a change at that one point.
  G90
  M140 S{bed}
  M190 S{bed}
  G4 P{c.soak_seconds|int * 1000}
  _KCTRL_PROBE_GUARD_ON CEILING={contact + 5.0}
  CX_ROUGH_G28 EXTRUDER_TEMP={contact + 90.0} BED_TEMP={bed}
  ACCURATE_G28
  _KCTRL_PROBE_GUARD_OFF
  BED_MESH_CLEAR
  {action_respond_info("K1 Control: reference contact at the centre, then %d laps of the bed" % rounds)}
  G1 Z5 F600
  G1 X150 Y150 F6000
  PROBE_ACCURACY SAMPLES=3
  {% for i in range(rounds) %}
    G1 Z5 F600
    G1 X18 Y23 F6000
    G1 X277 Y23 F6000
    G1 X277 Y274 F6000
    G1 X18 Y274 F6000
    G1 X150 Y150 F6000
    {action_respond_info("K1 Control: lap %d done, contact at the centre" % (i + 1))}
    PROBE
  {% endfor %}
  G1 Z5 F600
  TURN_OFF_HEATERS
  {action_respond_info("K1 Control: compare the centre readings. A drift means the Z reference is moving, a stable value clears the axis.")}
