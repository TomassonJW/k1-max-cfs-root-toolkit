# K1 Control - composite mesh acquisition, ADR-013 method
#
# PRTouch V2 raises an IndexError past 36 contacts inside one sequence, so a
# real 11x11 is acquired as four bounded 6x6 quadrants sharing the centre row
# and the centre column. On the 5..295 mm area every quadrant lands exactly on
# the 29 mm lattice, so the four matrices stitch without interpolation.
#
# ADR-045: this macro probes. It must never run unless Thomas has cleaned the
# nozzle by hand, which implies the filament is retracted. The head sensor is
# checked here, but a sensor never proves a nozzle is clean - the guard only
# catches the one failure it can actually see.

[gcode_macro KCTRL_MESH_ACQUIRE]
description: Acquire a real 11x11 mesh as four 6x6 quadrants in one hot session
gcode:
  {% set c = printer["gcode_macro KCTRL_START_CONF"] %}
  {% set bed = params.BED_TEMP|default(55)|float %}
  {% set soak = params.SOAK_SECONDS|default(c.soak_seconds)|int %}
  {% set band = bed|round|int %}
  {% set contact_temp = c.probe_contact_c|float %}
  {% set probe_temp = contact_temp + 90.0 %}
  {% set probe_ceiling = contact_temp + 5.0 %}

  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: mesh acquisition requires standby")}
  {% endif %}
  {% if printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    {action_raise_error("K1 Control: filament is still engaged in the head; retract it and clean the nozzle before probing")}
  {% endif %}
  {% if bed < 0.0 or bed > 120.0 %}
    {action_raise_error("K1 Control: BED_TEMP is outside the machine limits")}
  {% endif %}
  {% if soak < 0 or soak > 600 %}
    {action_raise_error("K1 Control: SOAK_SECONDS must be 0..600")}
  {% endif %}

  {action_respond_info("K1 Control: acquiring 11x11 for a %d C bed, contact at %d C, ceiling %d C, %d s soak" % (band, contact_temp|int, probe_ceiling|int, soak))}

  G90
  M140 S{bed}
  M190 S{bed}
  G4 P{soak * 1000}

  # Same thermal path as a print start: the contact always happens at
  # probe_contact_c, whatever the material, so every mesh and every print share
  # one hotend expansion state. CX_ROUGH_G28 derives its contact temperature as
  # EXTRUDER_TEMP - 90 and that argument has no other effect, hence contact + 90.
  #
  # The ceiling is enforced, not merely expected: a nozzle hotter than the
  # probing temperature oozes onto the plate and falsifies every later contact,
  # so any M104 or M109 above it aborts the whole acquisition.
  KCTRL_PROBE_GUARD_ON CEILING={probe_ceiling}
  CX_ROUGH_G28 EXTRUDER_TEMP={probe_temp} BED_TEMP={bed}
  ACCURATE_G28

  # homing_override reloads the default mesh on its own, so clear after homing.
  BED_MESH_CLEAR

  {action_respond_info("K1 Control: quadrant 1/4 south-west")}
  BED_MESH_CALIBRATE PROFILE=K1_SUB_SW MESH_MIN=5,5 MESH_MAX=150,150 PROBE_COUNT=6,6 ALGORITHM=bicubic
  {action_respond_info("K1 Control: quadrant 2/4 south-east")}
  BED_MESH_CALIBRATE PROFILE=K1_SUB_SE MESH_MIN=150,5 MESH_MAX=295,150 PROBE_COUNT=6,6 ALGORITHM=bicubic
  {action_respond_info("K1 Control: quadrant 3/4 north-west")}
  BED_MESH_CALIBRATE PROFILE=K1_SUB_NW MESH_MIN=5,150 MESH_MAX=150,295 PROBE_COUNT=6,6 ALGORITHM=bicubic
  {action_respond_info("K1 Control: quadrant 4/4 north-east")}
  BED_MESH_CALIBRATE PROFILE=K1_SUB_NE MESH_MIN=150,150 MESH_MAX=295,295 PROBE_COUNT=6,6 ALGORITHM=bicubic

  KCTRL_PROBE_GUARD_OFF
  BED_MESH_CLEAR
  {action_respond_info("K1 Control: four quadrants acquired for band %d C. The bed stays at temperature; merge them into k1_p%03d_t%03d_r%03d_n11x11 before printing." % (band, c.plate_id|int, band, c.probe_rev|int))}
