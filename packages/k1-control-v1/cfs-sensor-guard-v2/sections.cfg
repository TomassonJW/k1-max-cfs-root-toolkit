# K1 Control CFS sensor guard (ADR-077, document 105). remote_install.py adds
# this block at the end of k1-control-owned-end-candidate.cfg: it follows
# [kctrl_end], which must stay enabled or Klipper refuses to start.
[kctrl_sensor_guard]
enabled: True
boxes: 2
episode_seconds: 180
episode_printed_mm: 400
blind_seconds: 60
end_window: 900
end_push_limit: 1.0
auto_refill_timeout: 3
