# K1 Control - owned print start, version 2.
# Exact target: Creality K1 Max, S12 structure 0, firmware 2.3.5.34, CFS kit.
#
# This file redefines START_PRINT. Klipper parses its configuration with
# strict=False, so the last definition of a section wins: this include must
# stay after gcode_macro.cfg in printer.cfg.
#
# What it changes against the Creality start sequence:
#   - the bed mesh comes from a profile selected by the G-code bed temperature
#     instead of being re-probed at every print start;
#   - the Z offset comes from that same profile instead of a global value;
#   - CX_PRINT_LEVELING_CALIBRATION is removed, which is where the parasitic
#     probing came from;
#   - CX_NOZZLE_CLEAR is removed because the automatic brush never worked on
#     this machine; the nozzle is cleaned by hand before launching a print;
#   - the nozzle target is set back to the G-code value after the CFS step and
#     verified, so no material table temperature can leak into the print.
#
# Known stock behaviour this file works around: homing_override ends with
# BED_MESH_PROFILE LOAD="default". Every G28 therefore silently replaces the
# active mesh. The profile is loaded after the last homing for that reason.

[save_variables]
filename: /usr/data/printer_data/config/k1-control-saved-vars.cfg

# Provides KCTRL_WAIT_FILAMENT. A macro cannot do this job: a dwell inside a
# macro called from another macro is never even queued, so a grace period
# written that way silently does not exist. See kctrl_wait.py, deployed to
# /usr/share/klipper/klippy/extras/ - it needs a klipper service restart, not
# just a FIRMWARE_RESTART, because that reloads config and not Python modules.
[kctrl_wait]

# Provides printer["kctrl_slot_map"].map and KCTRL_MAP. Tnn_map - the table the
# screen writes when the operator matches the job's filaments to CFS slots - is
# not published in the Klipper box object, so no macro can see the answer the
# operator just gave. This reads the file the firmware writes, and nothing else.
# Same deployment as kctrl_wait.py: a klipper service restart, not a
# FIRMWARE_RESTART. See kctrl_slot_map.py.
[kctrl_slot_map]

[gcode_macro _KCTRL_START_CONF]
description: Mesh profile family used by the owned start sequence
variable_plate_id: 1
variable_probe_rev: 1
variable_x_count: 11
variable_y_count: 11
variable_default_tool: "T1A"
# Seconds held after the bed reaches target, before the geometry reference is
# taken. The calibration path uses the same value so a mesh and a print see the
# same thermal state.
variable_soak_seconds: 20
# Nozzle temperature at the moment of contact, for every material and every
# band. Probing hotter makes the nozzle ooze onto the plate and falsifies the
# contact, so this is an absolute ceiling, not a per-material derivation.
# CX_ROUGH_G28 computes its own contact temperature as EXTRUDER_TEMP - 90 and
# that argument has no other effect, so it is fed contact + 90.
variable_probe_contact_c: 100
gcode:
  {% set c = printer["gcode_macro _KCTRL_START_CONF"] %}
  {action_respond_info("K1 Control start: plate %d, probe revision %d, matrix %dx%d" % (c.plate_id|int, c.probe_rev|int, c.x_count|int, c.y_count|int))}

# ---------------------------------------------------------------------------
# CFS slot selection.
#
# The chain the stock firmware uses is: the slicer emits T0..T15, cmd_T resolves
# it through Tnn_map, and only then does a physical slot get addressed. This
# file loads the CFS by calling BOX_EXTRUDE_MATERIAL TNN=<slot> directly, which
# is the one path that reliably loads without the screen job's own mapping - but
# it addresses a physical slot and therefore walks past Tnn_map entirely.
#
# Walking past it is what broke slot choice: every print went to whatever
# default_tool said, T1A. The map is not decoration either. BOX_CHECK_MATERIAL_REFILL
# rewrites it, with the very same BOX_MODIFY_TN, when a spool runs out and a
# declared-identical one takes over. A route that ignores the map cannot follow
# a refill.
#
# Tnn_map is now the single answer to "which spool". Three writers, one table:
# the stock screen popup, which parses the sliced file and applies the operator's
# matching with BOX_MODIFY_TN; BOX_CHECK_MATERIAL_REFILL, when a spool runs out;
# and KCTRL_SLOT below, for the times there is no screen in the loop. START_PRINT
# reads it through kctrl_slot_map and loads what it finds.
#
# One thing is kept beside it: every pair KCTRL_SLOT was told to use, one
# save_variable per filament (slot_choice_t1a to slot_choice_t4d). The table is
# the machine's, and the machine wipes it - an emergency stop, a power cut, a
# firmware restart, and, measured four times on 2026-09-09, a normal end of
# print. Only the screen popup refills it, and Mainsail and Fluidd never call
# that popup, so without a memory every job after the first ends in a refused
# print. The memory cannot disagree with the table: it is read only where the
# table has a hole, START_PRINT writes those holes straight back in with
# BOX_MODIFY_TN before loading anything, and the start line names where the
# slot came from. Remembering all sixteen rather than the first one is what
# lets a multi-colour job survive: its first tool change happens long after
# START_PRINT has returned, and there is nothing there to ask by then.
#
# Verified on the machine on 2026-09-02, cold: BOX_MODIFY_TN T1A=T2C writes
# tnn_map into /usr/data/creality/userdata/box/tn_data.json and the firmware
# echoes the new table; BOX_MODIFY_TN T1A=T1A restores it exactly. No motion,
# no heating, nothing else in the box state moves.
# Multi-filament: a job that changes colour emits T0, T1, ... and the stock cmd_T
# resolves each through Tnn_map, whose entries are named by position - T1A is the
# slicer's first filament, T1B the second, and so on. TOOL= says which of those
# entries to point at a physical slot.
#
# This is the manual door. The normal one is the screen: start the print from the
# touchscreen, the Creality app or the Creality web page and the popup does the
# same writes, visually, with the job's colours on one side and the CFS on the
# other. Fluidd and Mainsail have no such popup and never call it - which is why
# every print here went to T1A.
#
#   KCTRL_SLOT SLOT=T2A                mono-filament, and first colour of a job
#   KCTRL_SLOT SLOT=T2B TOOL=T1B       second colour of the same job
[gcode_macro KCTRL_SLOT]
description: Point a slicer filament at a physical CFS slot, e.g. KCTRL_SLOT SLOT=T2C
gcode:
  {% set slot = params.SLOT|string|upper %}
  {% set logical = params.TOOL|default("T1A")|string|upper %}
  {% set boxes = ["1", "2", "3", "4"] %}
  {% set nums = {"A": 0, "B": 1, "C": 2, "D": 3} %}
  {% for name, value in [("SLOT", slot), ("TOOL", logical)] %}
    {% if value|length != 3 or value[0] != "T" or value[1] not in boxes or value[2] not in nums %}
      {action_raise_error("K1 Control: %s doit etre de la forme T1A a T4D, recu '%s'" % (name, value))}
    {% endif %}
  {% endfor %}
  {% set state = printer.box["T" ~ slot[1]] %}
  {% set material = state.material_type[nums[slot[2]]]|string %}
  {% if state.state|string != "connect" %}
    {action_raise_error("K1 Control: l'unite CFS %s n'est pas connectee, l'emplacement %s n'existe pas encore" % (slot[1], slot))}
  {% endif %}
  {% if material in ["-1", "None", ""] %}
    {action_raise_error("K1 Control: l'emplacement %s est vide, rien a charger" % slot)}
  {% endif %}
  # The only write. Nothing is mirrored anywhere else, so nothing can drift out
  # of step with the screen or with an auto refill.
  BOX_MODIFY_TN {logical}={slot}
  # Tnn_map does not survive the machine: an emergency stop, a power cut or a
  # firmware restart hands back a tn_data.json with base_data only, and every
  # print from Mainsail is then refused for a table that no longer exists.
  # Remembering the operator's last choice is not a second source of truth -
  # START_PRINT writes it straight back into the table before using it, and
  # says out loud that it did.
  SAVE_VARIABLE VARIABLE=slot_choice_{logical|lower} VALUE='"{slot}"'
  {% if logical == "T1A" %}
    SAVE_VARIABLE VARIABLE=slot_last_choice VALUE='"{slot}"'
  {% endif %}
  {action_respond_info("K1 Control: filament %s -> emplacement %s, matiere %s, couleur %s"
    % (logical, slot, material, state.color_value[nums[slot[2]]]))}

[gcode_macro KCTRL_SLOTS]
description: List the CFS slots, their material and colour, and the one now selected
gcode:
  {% set nums = ["A", "B", "C", "D"] %}
  # Same three-step resolution START_PRINT uses, in the same order: the table
  # first, then the remembered choice if the machine wiped the table, then
  # nothing - which is a refusal, not a default. Shown here so the answer can be
  # read before launching rather than discovered by a refused print.
  # The filament resolved here is the one the running job starts on, T1A when
  # nothing is running - the same question START_PRINT asks.
  {% set slot_map = printer["kctrl_slot_map"] %}
  {% set logical = slot_map.initial_logical|default("T1A", true)|string or "T1A" %}
  {% set mapped = slot_map.map.get(logical) %}
  {% set remembered = printer.save_variables.variables.get("slot_choice_" ~ logical|lower)
      or (printer.save_variables.variables.get("slot_last_choice")
          if logical == "T1A" else none) %}
  {% set chosen = (mapped if mapped else (remembered if remembered else ""))|string %}
  {% set source = "table CFS" if mapped
      else ("dernier choix retenu, table CFS effacee" if remembered
            else "aucune source: KCTRL_SLOT SLOT=... avant d'imprimer") %}
  {% for b in [1, 2, 3, 4] %}
    {% set state = printer.box["T" ~ b] %}
    {% if state.state|string == "connect" %}
      {% for i in range(4) %}
        {% set slot = "T%d%s" % (b, nums[i]) %}
        {% set material = state.material_type[i]|string %}
        {action_respond_info("%s %-8s matiere %-8s couleur %-8s reste %s"
          % ("->" if slot == chosen else "  ", slot,
             "vide" if material in ["-1", "None", ""] else material,
             state.color_value[i], state.remain_len[i]))}
      {% endfor %}
    {% endif %}
  {% endfor %}
  {action_respond_info("K1 Control: filament de depart %s -> %s (%s) | KCTRL_MAP pour la table complete, KCTRL_SLOT SLOT=T2C TOOL=%s pour changer sans l'ecran"
    % (logical, chosen if chosen else "-", source, logical))}

# Edit a slot's declared identity. The screen can already do the colour, and it
# calls BOX_UPDATE_SAME_MATERIAL_LIST itself afterwards - 124 times in the logs
# of this machine. This exists so the same edit can be made from Mainsail, and
# because the refill grouping depends on it: two spools are only interchangeable
# when material_type AND color_value match exactly.
[gcode_macro KCTRL_FILAMENT]
description: Set a CFS slot's material and/or colour, e.g. KCTRL_FILAMENT SLOT=T2C MATERIAL=000003 COLOR=0ffffff
gcode:
  {% set slot = params.SLOT|string|upper %}
  {% set boxes = ["1", "2", "3", "4"] %}
  {% set nums = ["A", "B", "C", "D"] %}
  {% if slot|length != 3 or slot[0] != "T" or slot[1] not in boxes or slot[2] not in nums %}
    {action_raise_error("K1 Control: SLOT doit etre de la forme T1A a T4D, recu '%s'" % slot)}
  {% endif %}
  {% if "MATERIAL" not in params and "COLOR" not in params %}
    {action_raise_error("K1 Control: donner au moins MATERIAL= ou COLOR=")}
  {% endif %}
  {% if "MATERIAL" in params %}
    BOX_MODIFY_TN_DATA ADDR={slot[1]} NUM={slot[2]} PART=material_type DATA={params.MATERIAL|string}
  {% endif %}
  {% if "COLOR" in params %}
    BOX_MODIFY_TN_DATA ADDR={slot[1]} NUM={slot[2]} PART=color_value DATA={params.COLOR|string|lower}
  {% endif %}
  # Without this the refill groups keep the old identity and a spool that just
  # became a twin of its neighbour is still not eligible to take over.
  BOX_UPDATE_SAME_MATERIAL_LIST
  {action_respond_info("K1 Control: %s mis a jour, groupes de rechange recalcules" % slot)}

[gcode_macro KCTRL_PROFILE_NAME]
description: Print the profile name that a given bed temperature resolves to
gcode:
  {% set c = printer["gcode_macro _KCTRL_START_CONF"] %}
  {% set band = params.BED_TEMP|default(55)|float|round|int %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (c.plate_id|int, band, c.probe_rev|int, c.x_count|int, c.y_count|int) %}
  {% set known = profile in printer.bed_mesh.profiles %}
  {% set z = printer.save_variables.variables.get("z_" ~ profile) %}
  {action_respond_info("bed %d C -> %s | mesh %s | Z %s" % (band, profile, "present" if known else "MISSING", z if z is not none else "MISSING"))}

[gcode_macro KCTRL_Z_SAVE]
description: Save the accepted Z offset of a mesh profile
gcode:
  {% set profile = params.PROFILE|default(printer.bed_mesh.profile_name)|string %}
  {% set z = params.Z|default(printer.gcode_move.homing_origin.z)|float %}
  {% if profile in ["", "default", "None"] %}
    {action_raise_error("K1 Control: PROFILE is required and cannot be the default mesh")}
  {% endif %}
  {% if profile not in printer.bed_mesh.profiles %}
    {action_raise_error("K1 Control: mesh profile %s does not exist" % profile)}
  {% endif %}
  {% if z < -2.0 or z > 2.0 %}
    {action_raise_error("K1 Control: Z %.4f is outside the -2..2 mm limit" % z)}
  {% endif %}
  SAVE_VARIABLE VARIABLE=z_{profile|lower} VALUE={z}
  {action_respond_info("K1 Control: Z %.4f saved for %s" % (z, profile))}

[gcode_macro KCTRL_Z_LIST]
description: List every mesh profile with its saved Z offset
gcode:
  {% set vars = printer.save_variables.variables %}
  {% for profile in printer.bed_mesh.profiles %}
    {% set z = vars.get("z_" ~ profile|lower) %}
    {action_respond_info("%-28s Z %s" % (profile, z if z is not none else "MISSING"))}
  {% endfor %}

[gcode_macro _KCTRL_START_VERIFY]
description: Fail loudly if the effective mesh or Z is not the one this job armed
gcode:
  {% set profile = params.PROFILE|string %}
  {% set z = params.Z|float %}
  {% set stage = params.STAGE|default("unknown")|string %}
  {% if printer.bed_mesh.profile_name|string != profile %}
    {action_raise_error("K1 Control [%s]: active mesh is %s instead of %s" % (stage, printer.bed_mesh.profile_name, profile))}
  {% endif %}
  {% if (printer.gcode_move.homing_origin.z|float - z)|abs > 0.0005 %}
    {action_raise_error("K1 Control [%s]: effective Z is %.4f instead of %.4f" % (stage, printer.gcode_move.homing_origin.z|float, z))}
  {% endif %}

[gcode_macro _KCTRL_ASSERT_FILAMENT_ENGAGED]
description: Refuse to print into the void; the toolhead sensor must see filament
gcode:
  {% set stage = params.STAGE|default("unknown")|string %}
  {% if not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    {action_raise_error("K1 Control [%s]: no filament after the cutter, the CFS did not load; refusing to print into the void" % stage)}
  {% endif %}

[gcode_macro _KCTRL_PURGE_MARK]
description: Record the extruder axis before the material step, to measure it
variable_e_start: 0.0
variable_marked: 0
gcode:
  # Read after an M400 in the caller. A macro template renders when its command
  # is processed, and M400 blocks the command queue until the moves are done, so
  # a mark taken right after one reads a position that has actually happened.
  SET_GCODE_VARIABLE MACRO=_KCTRL_PURGE_MARK VARIABLE=e_start VALUE={printer.toolhead.position[3]}
  SET_GCODE_VARIABLE MACRO=_KCTRL_PURGE_MARK VARIABLE=marked VALUE=1

[gcode_macro _KCTRL_PURGE_REPORT]
description: Report how much filament the whole material step actually pushed
gcode:
  {% set mark = printer["gcode_macro _KCTRL_PURGE_MARK"] %}
  {% if mark.marked|int == 1 %}
    {% set travel = printer.toolhead.position[3]|float - mark.e_start|float %}
    # The head switch sits after the cutter and before the extruder gears, so
    # seeing filament there is not the same as having primed the nozzle. The
    # travel of the extruder axis is the only honest answer to "was the purge
    # big enough" - when it can be read at all.
    #
    # It usually cannot. The box routines issue G92 E0 inside the material step,
    # which restarts the axis under the mark, and the difference then comes out
    # negative or absurdly small. Measured on 2026-09-02: -2 mm. Rather than
    # print a number that is wrong, say so, and fall back on the one length this
    # file actually commands. A real odometer has to read the stepper position,
    # which G92 does not touch, and that is a Python job.
    {% if travel > 1.0 %}
      {action_respond_info(
        "K1 Control: %.0f mm pousses par l'extrudeur sur toute l'etape matiere"
        % travel)}
    {% else %}
      {action_respond_info(
        "K1 Control: total non mesurable, l'axe extrudeur a ete remis a zero "
        "pendant l'etape matiere; complement de purge commande: %.0f mm"
        % printer["gcode_macro _KCTRL_PURGE_BALL"].purge_mm|float)}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_KCTRL_PURGE_MARK VARIABLE=marked VALUE=0
  {% endif %}

[gcode_macro _KCTRL_PURGE_BALL]
description: Top up the purge to the length box.cfg claims but does not push
# box.cfg declares box_need_clean_length: 140, and the operator judged that 140
# is enough - when 140 actually comes out. It does not. Reconstructed from the
# statistics of the print of 2026-09-02 00:23, which are the only trace of what
# the compiled box module really does:
#
#   00:23:30 - 00:23:39   print_time frozen, buffer 0   the CFS pushes on its
#                                                       own bus, nothing moves
#   00:23:42 - 00:24:00   print_time +32.4 s at 220 C   the toolhead extrudes
#
# Those 32.4 s cover BOX_EXTRUDER_EXTRUDE and the flush together. box.cfg gives
# Tn_extrude: 140 at Tn_extrude_velocity: 360 mm/min, which is 23.3 s of the
# 32.4, leaving about 9 s for the flush itself - of the order of 55 mm, not 140.
#
# So this pushes the difference, at the G-code temperature, once the filament
# is really in the head.
#
# The length is settled by eye over the bin rather than by arithmetic, and it
# is bounded on both sides. 200 mm was run on 2026-09-02 and gave the ball
# that detaches instead of the strand that hangs. 180 mm was run next and
# overflows the bin a little. 120 mm is the ceiling the operator set from
# there: enough to form the ball, not enough to spill.
#
# _KCTRL_PURGE_REPORT was meant to settle it with a measurement and does not:
# it reported -2 mm on 2026-09-02, because the box routines issue G92 E0 during
# the material step and the extruder axis restarts from zero under it. An
# honest odometer has to read the stepper position, which is a Python job.
#
# Adjust it live, it takes effect on the next print start:
#   SET_GCODE_VARIABLE MACRO=_KCTRL_PURGE_BALL VARIABLE=purge_mm VALUE=150
variable_purge_mm: 120.0
# Filament feed rate in mm/min. 300 is 5 mm/s, about 12 mm3/s on 1.75 mm
# filament, under the 14 mm3/s this machine reports as its volumetric ceiling.
variable_purge_speed: 300.0
gcode:
  {% set conf = printer["gcode_macro _KCTRL_PURGE_BALL"] %}
  {% set total = params.LEN|default(conf.purge_mm)|float %}
  {% set speed = params.SPEED|default(conf.purge_speed)|float %}
  {% set temp = params.TEMP|float %}
  {% if total > 0.0 %}
    # Positioned explicitly rather than inherited. BOX_MATERIAL_FLUSH places the
    # head itself, but this purge runs before it, and a hundred millimetres
    # extruded at the wrong place is not worth betting on an assumption.
    BOX_GO_TO_EXTRUDE_POS
    # At the G-code temperature, not the CFS material table one. This is the
    # only purge on the route whose temperature is ours.
    M109 S{"%.0f" % temp}
    M83
    # Sliced so each move stays a bounded one and the queue keeps a chance to
    # report. Klipper allows 1000 mm in a single extrude-only move here, so the
    # slicing is for legibility and interruptibility, not for a limit. Whole
    # slices plus one remainder, rather than equal slices: equal slices carry
    # their rounding error once per slice, and a purge asked for 1000 that
    # pushes 1000.008 is a purge whose number cannot be trusted.
    {% set slices = (total / 60.0)|int %}
    {% for _ in range(slices) %}
      G1 E60.000 F{speed}
    {% endfor %}
    {% if total - slices * 60.0 > 0.0005 %}
      G1 E{"%.3f" % (total - slices * 60.0)} F{speed}
    {% endif %}
    M400
    {action_respond_info(
      "K1 Control: complement de purge de %.0f mm a %.0f C, avant la purge stock"
      % (total, temp))}
  {% endif %}

[gcode_macro _KCTRL_PRIME_LINE]
description: The line drawn before the first layer, owned rather than inherited
# CX_PRINT_DRAW_ONE_LINE, despite its name, draws no line on a normal start.
# Read custom_macro.py line 55: it homes if asked, retracts, heats, waits - and
# everything after that sits inside `if self.pheaters.can_break_flag == 3`.
# The three strands at Z 0.3 seen on 2026-09-09 were its filament-break
# recovery path, not a prime line, and they were drawn because the break flag
# was already latched when the macro started.
#
# So the stock call stays for what it really does - the retraction, the heat
# soak and the break-flag reset, which is a Python attribute a macro cannot
# touch - and the line itself is drawn here, always, to numbers that are ours.
#
# The three parameters trade against each other and cannot all be maximised.
# Material laid per millimetre of travel is volumetric rate divided by head
# speed, so tripling the speed at a fixed rate makes the line thinner, not
# fatter. Stock is 10 mm of filament over 160 mm at F3000: 7.5 mm3/s, 0.15 mm2
# of section, 3.2 s. These defaults keep the same 3.2 s and put 2.7 times the
# material down in it, by running three passes instead of one.
#
# 20 mm3/s is the operator's number. The CFS material table declares 14 for
# this filament (max_volumetric_speed: 14 in the log of 2026-09-09 23:42), so
# this deliberately runs above the declared ceiling - over a priming strip,
# not over the part. Lower it if the extruder skips:
#   SET_GCODE_VARIABLE MACRO=_KCTRL_PRIME_LINE VARIABLE=volumetric VALUE=14
variable_line_z: 0.36
# Stock draws at 0.30. The extra 0.06 is the operator's margin after a prime
# line welded itself to the plate on 2026-09-09.
variable_line_speed: 9000.0
# mm/min. Three times the stock F3000.
variable_volumetric: 20.0
variable_passes: 3
variable_y_start: 20.0
variable_y_end: 180.0
variable_x_first: -1.7
variable_x_step: 0.3
gcode:
  {% set c = printer["gcode_macro _KCTRL_PRIME_LINE"] %}
  {% set speed = c.line_speed|float %}
  {% set z = c.line_z|float %}
  # 1.75 mm filament, area pi*(d/2)^2.
  {% set e_per_mm = c.volumetric|float / (speed / 60.0) / 2.40528 %}
  {% set length = c.y_end|float - c.y_start|float %}
  {% set e_pass = e_per_mm * length %}
  M83
  G90
  G1 Z{"%.3f" % (z + 2.0)} F1200
  G1 X{"%.2f" % c.x_first|float} Y{"%.2f" % c.y_start|float} F12000
  G1 Z{"%.3f" % z} F600
  {% for i in range(c.passes|int) %}
    {% set x = c.x_first|float + i * c.x_step|float %}
    {% set from_y = c.y_start|float if i % 2 == 0 else c.y_end|float %}
    {% set to_y = c.y_end|float if i % 2 == 0 else c.y_start|float %}
    G1 X{"%.2f" % x} Y{"%.2f" % from_y} F12000
    G1 X{"%.2f" % x} Y{"%.2f" % to_y} Z{"%.3f" % z} E{"%.4f" % e_pass} F{"%.0f" % speed}
  {% endfor %}
  # Break the strand off rather than dragging it onto the part.
  G1 E-0.8 F2700
  G1 Z{"%.3f" % (z + 2.0)} F600
  G92 E0
  M400
  {action_respond_info(
    "K1 Control: ligne d'amorce, %d passes de %.0f mm a Z %.2f, %.0f mm/s, %.1f mm3/s, %.1f mm de filament"
    % (c.passes|int, length, z, speed / 60.0, c.volumetric|float, e_pass * c.passes|int))}

[gcode_macro _KCTRL_CFS_LOAD]
description: One CFS load attempt; does nothing once the head sensor sees filament
gcode:
  {% set tool = params.TOOL|string %}
  {% set n = params.ATTEMPT|default(1)|int %}
  {% if not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    {% if n > 1 %}
      {action_respond_info("K1 Control: CFS attempt %d for %s, the previous one did not reach the head" % (n, tool))}
    {% endif %}
    # BOX_ERROR_CLEAR belongs inside the loop, not before it. The CFS exhausts
    # its own five internal retries, then latches an error, and from that point
    # every further BOX_EXTRUDE_MATERIAL returns immediately without moving
    # anything. Measured on the machine on 2026-09-01: first push failed with
    # key836, a bare repeat was a silent no-op, the same push after an error
    # clear loaded normally.
    BOX_ERROR_CLEAR
    BOX_EXTRUDE_MATERIAL TNN={tool}
    M400
    # Let the head switch settle before the next attempt renders and reads it.
    # The trailing M400 is what makes the settle real: G4 queues a pause on the
    # motion queue without blocking the command queue, so a dwell with nothing
    # after it lets the next attempt render immediately and read a stale pin.
    G4 P250
    M400
  {% endif %}

[gcode_macro START_PRINT]
description: K1 Control owned start - one geometry reference, profile mesh and Z, G-code temperatures
variable_active_profile: "none"
variable_active_z: 0.0
variable_start_running: 0
variable_guard_until: 0.0
gcode:
  {% set c = printer["gcode_macro _KCTRL_START_CONF"] %}
  {% set bed = params.BED_TEMP|default(0)|float %}
  {% set nozzle = params.EXTRUDER_TEMP|default(0)|float %}
  {% set band = bed|round|int %}
  # Which spool this job prints from, in two steps.
  #
  # Step one, which of the sixteen filaments the job starts on. A file can
  # declare sixteen and print with any one of them: the file of 2026-09-09
  # declared two and issued a single T1, its second. Assuming the first one is
  # how the black Geeetech of T1B got loaded and purged for a job that wanted
  # the eSUN of T2D, and how the T1 that followed became a tool change in the
  # middle of the start - ending on macro_box_extrude_err.
  #
  # kctrl_slot_map reads the first Tn line of the file virtual_sdcard is
  # running, which needs no re-slicing of anything already on the machine.
  # TOOL_INDEX= overrides it for a G-code that wants to say so itself; Orca
  # exposes the number as [initial_extruder].
  #
  # Step two, which physical slot that filament points at. The answer lives in
  # Tnn_map, written by whoever last decided: the screen popup, an auto refill,
  # or KCTRL_SLOT.
  {% set slot_map = printer["kctrl_slot_map"] %}
  {% set names = ["T1A", "T1B", "T1C", "T1D", "T2A", "T2B", "T2C", "T2D",
                  "T3A", "T3B", "T3C", "T3D", "T4A", "T4B", "T4C", "T4D"] %}
  {% if params.TOOL_INDEX is defined %}
    {% if params.TOOL_INDEX|int(-1) < 0 or params.TOOL_INDEX|int(-1) > 15 %}
      {action_raise_error("K1 Control: TOOL_INDEX=%s hors des 16 filaments du CFS" % params.TOOL_INDEX)}
    {% endif %}
    {% set logical = names[params.TOOL_INDEX|int] %}
  {% else %}
    {% set logical = slot_map.initial_logical|default("", true)|string %}
  {% endif %}
  {% if not logical %}
    {action_raise_error("K1 Control: filament de depart indetermine (%s); relancer depuis l'ecran ou passer TOOL_INDEX=" % slot_map.initial_note)}
  {% endif %}
  {% set position = names.index(logical) + 1 %}
  {% set mapped = slot_map.map.get(logical) %}
  # The table is wiped by the machine itself - an emergency stop, a power cut,
  # a firmware restart - and only the screen popup refills it, which Mainsail
  # and Fluidd never call. Falling back on the operator's last explicit choice
  # keeps that from turning every recovery into a refused print. It is not a
  # guess: BOX_MODIFY_TN below writes it back into the table, and the start
  # line names where the slot came from.
  #
  # The remembered choice only ever answers for the job's first filament. It is
  # a single value, and answering for filament nine with it would be the same
  # blind guess this whole section exists to end.
  {% set remembered = printer.save_variables.variables.get("slot_choice_" ~ logical|lower)
      or (printer.save_variables.variables.get("slot_last_choice")
          if logical == "T1A" else none) %}
  {% set tool = params.TOOL|default(mapped if mapped else (remembered if remembered else ""))|string|upper %}
  {% set slot_source = "TOOL= impose" if params.TOOL is defined
      else ("table CFS" if mapped else "dernier choix retenu, table CFS effacee") %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (c.plate_id|int, band, c.probe_rev|int, c.x_count|int, c.y_count|int) %}
  {% set saved_z = printer.save_variables.variables.get("z_" ~ profile) %}
  {% set contact_temp = c.probe_contact_c|float %}
  {% set probe_temp = contact_temp + 90.0 %}
  {% set probe_ceiling = contact_temp + 5.0 %}
  # Fifteen degrees of headroom above the G-code temperature for the CFS load.
  # The melt zone has to push and purge, not print, and a corrected material
  # database sits inside that margin; anything further above it is the stock
  # number coming back.
  {% set load_ceiling = nozzle + 15.0 %}

  {% if bed <= 0.0 or nozzle <= 0.0 %}
    {action_raise_error("K1 Control: START_PRINT needs BED_TEMP and EXTRUDER_TEMP from the G-code")}
  {% endif %}
  {% if bed > 120.0 or nozzle > 300.0 %}
    {action_raise_error("K1 Control: G-code temperatures are outside the machine limits")}
  {% endif %}
  {% if profile not in printer.bed_mesh.profiles %}
    {action_raise_error("K1 Control: no mesh profile %s for a %d C bed; calibrate that band before printing" % (profile, band))}
  {% endif %}
  {% if saved_z is none %}
    {action_raise_error("K1 Control: no accepted Z for %s; print the calibration square then run KCTRL_Z_SAVE" % profile)}
  {% endif %}
  {% set slot_nums = {"A": 0, "B": 1, "C": 2, "D": 3} %}
  # Tnn_map does not survive the machine, and a normal end of print wipes it
  # too - measured four times on 2026-09-09, after two finished prints and two
  # cancels. Writing back only the filament this job starts on would leave a
  # multi-colour job to fail at its first tool change instead of at its start,
  # which is worse. So every pair KCTRL_SLOT was ever told, and that the table
  # has since lost, is written back here. A pair whose slot is now empty or
  # whose unit is unplugged is skipped: the checks below say so properly for
  # the one filament that matters, and a stale pair helps nobody.
  {% set kept_all = printer.save_variables.variables %}
  {% for name in names %}
    {% if slot_map.map.get(name) is none %}
      {% set kept = kept_all.get("slot_choice_" ~ name|lower)|default("", true)|string|upper %}
      {% if kept|length == 3 and kept[0] == "T" and kept[1] in ["1", "2", "3", "4"]
            and kept[2] in slot_nums
            and printer.box["T" ~ kept[1]].state|string == "connect"
            and printer.box["T" ~ kept[1]].material_type[slot_nums[kept[2]]]|string
                not in ["-1", "None", ""] %}
        BOX_MODIFY_TN {name}={kept}
      {% endif %}
    {% endif %}
  {% endfor %}
  # No silent fallback to T1A. Printing from the wrong spool without saying so
  # is the exact failure this whole section exists to end.
  {% if not tool %}
    {action_raise_error("K1 Control: le filament %d (%s) du travail ne pointe sur aucun emplacement (%s); KCTRL_SLOTS pour voir les bobines, puis KCTRL_SLOT SLOT=... TOOL=%s"
      % (position, logical, slot_map.error, logical))}
  {% endif %}
  {% if tool|length != 3 or tool[0] != "T" or tool[1] not in ["1", "2", "3", "4"] or tool[2] not in slot_nums %}
    {action_raise_error("K1 Control: emplacement CFS invalide '%s'; attendu T1A a T4D" % tool)}
  {% endif %}
  # An absent unit and an empty slot both read as material -1, and the fix is
  # not the same one: plugging a third CFS in, or loading a spool. The message
  # says which. The box object always publishes T1 to T4, connected or not.
  {% if printer.box["T" ~ tool[1]].state|string != "connect" %}
    {action_raise_error("K1 Control: le filament %d (%s) veut l'emplacement %s, mais l'unite CFS %s n'est pas connectee"
      % (position, logical, tool, tool[1]))}
  {% endif %}
  {% if printer.box["T" ~ tool[1]].material_type[slot_nums[tool[2]]]|string in ["-1", "None", ""] %}
    {action_raise_error("K1 Control: l'emplacement %s est vide; KCTRL_SLOTS pour voir ce qui est charge" % tool)}
  {% endif %}
  # The stock loader heats to the nozzle_temperature of the slot's material
  # record, never to what the file asked for, and waits for it. The loading
  # window below cannot lower that target: the loader re-asks every second and
  # waits for a temperature the capped nozzle never reaches - measured on
  # 2026-09-10 at 10:06, five minutes of "M104 S220 ... ramene a 205 C" with
  # cancel queued behind it, ended by an emergency stop. And the firmware
  # rewrites the database at every boot, which is how the record corrected on
  # the 9th was back at 220 C on the 10th.
  # So the record is aligned on the file instead, here, before anything heats
  # or moves: KCTRL_MATERIAL_ALIGN writes the file's temperature into the
  # record and reads it back, and the loader, which re-reads the file at every
  # load, heats to that. A record nobody can read is a refusal, since the
  # loader would heat to a value nobody knows.
  {% set slot_type = printer.box["T" ~ tool[1]].material_type[slot_nums[tool[2]]]|string %}
  {% set material = slot_type[1:] if slot_type|length == 6 and slot_type[0] == "0" else slot_type %}
  {% set load_temp = slot_map.material_temp.get(material) %}
  {% if load_temp is none %}
    {action_raise_error("K1 Control: temperature de chargement inconnue pour l'emplacement %s (fiche matiere %s): %s; le chargeur CFS chaufferait a une valeur que personne ne connait"
      % (tool, material, slot_map.material_temp_error or "fiche absente de la base"))}
  {% endif %}
  KCTRL_MATERIAL_ALIGN MATERIAL={material} TEMP={nozzle|int}

  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=active_profile VALUE='"{profile}"'
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=active_z VALUE={saved_z|float}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=start_running VALUE=1
  {action_respond_info("K1 Control start: bed %d C, nozzle %d C, filament %d du fichier (%s) -> emplacement %s (%s), mesh %s, Z %.4f"
    % (band, nozzle|int, position, logical, tool, slot_source, profile, saved_z|float))}

  # Clear a probing window left open by an aborted calibration, so a stale
  # ceiling can never block a print. This start opens its own window below.
  _KCTRL_PROBE_GUARD_OFF
  # Same for the loading window: a print that died between its two CFS markers
  # leaves it armed, and its ceiling belongs to that job, not to this one.
  _KCTRL_LOAD_GUARD_OFF

  BOX_START_PRINT
  G90
  WAIT_TEMP_END
  CLEAR_PAUSE
  PRINT_PREPARE_CLEAR
  M220 S100
  M221 S100
  BED_MESH_CLEAR
  SET_GCODE_OFFSET_BASE Z=0.0 MOVE=0

  # Thermal state of the reference. Nothing can ooze onto it: the toolhead is
  # still empty at this point, the CFS material step comes after the homing.
  #
  # The nozzle is deliberately NOT preheated here. CX_ROUGH_G28 derives its own
  # probing temperature as EXTRUDER_TEMP - 90 (capped at 180) and issues that
  # M104 itself, so preheating to the print temperature only forces the hotend
  # to cool back down before the probe can run. Reaching the probing point from
  # below is faster and keeps any residue from melting onto the plate.
  M140 S{bed}
  M190 S{bed}
  G4 P{c.soak_seconds|int * 1000}

  # One geometry reference. No leveling calibration, no brush. The ceiling is
  # enforced across the whole reference: a nozzle above the probing temperature
  # oozes onto the plate and falsifies the contact.
  _KCTRL_PROBE_GUARD_ON CEILING={probe_ceiling}
  CX_ROUGH_G28 EXTRUDER_TEMP={probe_temp} BED_TEMP={bed}
  ACCURATE_G28
  _KCTRL_PROBE_GUARD_OFF

  # The profile is loaded after the last homing because homing_override reloads
  # the default mesh on its own.
  BED_MESH_PROFILE LOAD={profile}
  SET_GCODE_OFFSET_BASE Z={saved_z|float} MOVE=0
  _KCTRL_START_VERIFY PROFILE={profile} Z={saved_z|float} STAGE=armed

  # CFS material step, with an explicit route. The stock one,
  # BOX_START_PRINT_EXTRUDE_MATERIAL START_PRINT=8, resolves the slot itself and
  # would do the job, but it also owns the retries, the heating and the purge,
  # and every one of those was measured and reshaped here for a reason: four
  # push attempts because a single one gives up short of the head without
  # failing, a wait on the head switch before anything is pushed, and a nozzle
  # actually at temperature rather than merely targeted. So the stock primitives
  # are called directly instead, exactly as BOX_LOAD_MATERIAL_WITHOUT_MATERIAL
  # does, BOX_CHECK_MATERIAL included: both stock load paths call it first.
  #
  # Nothing is lost on purge by doing so. The G-code's flush volumes describe
  # colour changes, and every colour change goes through the stock cmd_T, which
  # reads them from the sliced file itself. The first load has no colour to
  # change from.
  #
  # The push is retried up to four times. A single attempt is not enough: the
  # CFS reports key836 and gives up while the filament is still short of the
  # head, and it does so without failing the sequence, so nothing downstream
  # notices. _KCTRL_CFS_LOAD reads the head sensor at render time, which makes
  # every attempt after a success a no-op.
  # Everything from here to the end of the purge is the stock loader's ground,
  # and the stock loader heats to the material database temperature of the slot
  # it pulls from, not to what the G-code asked for. That record was aligned on
  # the file above, before anything heated; this window is the net under it,
  # for a path that reads some other record, and it refuses rather than lowers,
  # because a lowered target is one the loader waits for forever.
  _KCTRL_LOAD_GUARD_ON CEILING={load_ceiling}
  M104 S{nozzle}
  M400
  _KCTRL_PURGE_MARK
  # The slot above came from this table, so this line normally rewrites it with
  # the value it already held. It earns its place in the one case where it does
  # not: an explicit TOOL= overrides the map, and everything stock downstream -
  # a mid-print tool change, and above all BOX_CHECK_MATERIAL_REFILL when a
  # spool runs out - must then be told what is actually loaded.
  #
  # It writes the entry of the filament the job starts on, not T1A. Measured on
  # 2026-09-09: BOX_MODIFY_TN merges into Tnn_map, it does not replace it, so
  # the other fifteen filaments of a sixteen colour job keep their slots.
  BOX_MODIFY_TN {logical}={tool}
  BOX_CHECK_MATERIAL
  # The tool change belongs here, not to the G-code that follows this macro.
  #
  # A sliced file carries exactly one T command and the slicer puts it AFTER
  # the start block - line 275 of the file of 2026-09-09, twelve lines below
  # its START_PRINT. By the time it runs, this macro has already loaded and
  # purged, and the compiled CFS module then reads its own state as:
  #
  #   cmd_T last_cmd=None, get_fialment_sensor_detect()=True
  #   cmd_T ret = self.box_action_move_to_cut
  #
  # last_cmd is the tool the CFS believes is loaded, and nothing this macro
  # called before ever set it - BOX_EXTRUDE_MATERIAL does not. So the module
  # sees filament in the head that it cannot attribute, concludes a foreign
  # spool has to go before the new one can come in, and cuts. Then it
  # reinserts, repurges, and restores a Z it recorded before our purge moved
  # it - which is where Move out of range: 185.500 291.500 -18.951 comes from,
  # and that refusal is not caught inside the compiled module, so the G-code
  # queue never unblocks. Cancel is ignored from there; only a Klipper restart
  # gets the machine back. Measured end to end on 2026-09-09 at 23:42.
  #
  # Issued here the head is still empty, so the same cmd_T takes its other
  # branch: no cut, a normal load, and last_cmd set. The T of the file then
  # resolves to the same tool and does nothing at all.
  #
  # The literal is the file's own spelling - index into the sixteen names,
  # zero based - so it goes through exactly the path the G-code would have
  # taken, not a second one written from guesswork.
  {% if printer.box.enable|int == 1 %}
    T{position - 1}
    M400
  {% endif %}
  _KCTRL_CFS_LOAD TOOL={tool} ATTEMPT=1
  _KCTRL_CFS_LOAD TOOL={tool} ATTEMPT=2
  _KCTRL_CFS_LOAD TOOL={tool} ATTEMPT=3
  _KCTRL_CFS_LOAD TOOL={tool} ATTEMPT=4
  # Nothing pushes filament until the head sensor actually sees it. The four
  # attempts above each end on M400 and a settle, but the CFS keeps feeding on
  # its own bus after that, and the stock flush is sized for a head that already
  # holds material. Started too early it is spent on an empty melt zone and what
  # comes out is a strand, not a ball.
  #
  # Fifteen seconds of grace, measured against the machine: the CFS needs seven
  # to eight seconds minimum to reach the head, and its own trigger delay before
  # that is not known. Polled every 200 ms, so a load that arrives early costs
  # a fifth of a second, not fifteen, and the command fails the print if the
  # filament never turns up.
  #
  # This is a Python command, not a macro that dwells, because a macro that
  # dwells does nothing at all when it is called from inside another macro -
  # and inside START_PRINT is the only place it would ever be used. Measured on
  # 2026-09-02: ten polls flat took 8.14 s, the same ten through one macro took
  # 0.02 s, and a top level M400 straight after showed the dwells had never
  # even been queued. See kctrl_wait.py.
  KCTRL_WAIT_FILAMENT SENSOR=filament_sensor_2 TIMEOUT=15
  _KCTRL_ASSERT_FILAMENT_ENGAGED STAGE=after_cfs_load
  # Hot before anything is pushed, and waited on. The stock flush only sets a
  # target: the log of 2026-09-02 00:22 shows it running with the nozzle at
  # 109 C while the CFS target sat at 220. Almost nothing comes out of a nozzle
  # at 109 C, which is the other half of why the purge looked too small.
  M109 S{nozzle}
  BOX_EXTRUDER_EXTRUDE TNN={tool}
  # Our top up first, the stock flush last: whatever BOX_MATERIAL_FLUSH does at
  # the end of its routine to detach the blob and wipe is what has always
  # worked here, and it has to stay the last thing that happens over the bin.
  _KCTRL_PURGE_BALL TEMP={nozzle}
  BOX_MATERIAL_FLUSH TEMP={nozzle}
  M400
  _KCTRL_PURGE_REPORT
  # The stock loader is done. From here the G-code owns the temperature again,
  # and a second filament in the same job must be free to ask for more.
  _KCTRL_LOAD_GUARD_OFF
  # Runout detection is armed at the end of this macro, not here: the prime line
  # below is drawn with the head switch still off so a marginal contact during
  # priming cannot pause a print that is starting normally.
  M104 S{nozzle}
  M109 S{nozzle}
  _KCTRL_ASSERT_FILAMENT_ENGAGED STAGE=after_cfs
  _KCTRL_START_VERIFY PROFILE={profile} Z={saved_z|float} STAGE=after_cfs

  _KCTRL_ASSERT_FILAMENT_ENGAGED STAGE=before_prime
  {% set need_retraction = 12 if printer.box.enable|int == 1 else 0 %}
  # Kept for the retraction, the heat soak and the break-flag reset it does in
  # Python. It draws nothing unless the break flag is latched; see
  # _KCTRL_PRIME_LINE for why the line itself is drawn separately.
  CX_PRINT_DRAW_ONE_LINE EXTRUDER_TEMP={nozzle} BED_TEMP={bed} NEED_G28=0 NEED_RETRACTION={need_retraction}
  _KCTRL_PRIME_LINE

  # Runout detection, armed once the first line is down.
  #
  # This is the switch after the cutter, and its stock runout_gcode ends on
  # BOX_CHECK_MATERIAL_REFILL - the command that hands a spent spool over to a
  # declared-identical one. With the switch disabled that command is never
  # reached, which is the whole reason auto refill stopped working here.
  #
  # It was armed once before and reverted, because END_PRINT unloads through the
  # cutter: the switch empties on a perfectly normal end of print, the runout
  # fires, and the machine pauses after the last layer with nothing to resume.
  # The fix is at the bottom of this file: END_PRINT and CANCEL_PRINT disarm
  # the switch before the stock unload they both trigger.
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1

  # The guard closes shortly after the start returns. It only has to survive the
  # lines the slicer injects right after START_PRINT; every later adjustment,
  # including the operator tuning Z live during the first layer, goes through.
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=start_running VALUE=0
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=guard_until VALUE={printer.toolhead.estimated_print_time|float + 30.0}

# ---------------------------------------------------------------------------
# Compatibility with the G-code files already sliced by Orca.
#
# Their start block contains two lines that predate this package:
#
#   SET_GCODE_OFFSET Z=0 MOVE=1 MOVE_SPEED=5 ; POSTPROC global start Z offset
#   KCTRL_PRODUCTION_ARM PLATE=1 TEMP_BAND=55 ... X_COUNT=11 Y_COUNT=11
#
# The first would erase the Z of the resolved profile. The second belongs to
# the previous owner and would reload a global Z record. Both are neutralised
# here so existing files stay printable without re-slicing. Removing them from
# the Orca profile remains the clean end state.
# ---------------------------------------------------------------------------

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_BASE
description: Standard Klipper offset, with the armed profile Z protected during a print
gcode:
  {% set sp = printer["gcode_macro START_PRINT"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set window = sp.start_running|int == 1 or now < sp.guard_until|float %}
  {% if sp.active_profile|string != "none" and window and "Z" in params %}
    {action_respond_info("K1 Control: absolute SET_GCODE_OFFSET Z=%s ignored during the start window, the Z of %s stays in force" % (params.Z, sp.active_profile))}
    {% if "X" in params or "Y" in params %}
      SET_GCODE_OFFSET_BASE{% if "X" in params %} X={params.X}{% endif %}{% if "Y" in params %} Y={params.Y}{% endif %}
    {% endif %}
  {% else %}
    SET_GCODE_OFFSET_BASE {rawparams}
  {% endif %}

[gcode_macro KCTRL_PRODUCTION_ARM]
description: Checkpoint kept for already sliced files; the owned start does the arming
gcode:
  {% set sp = printer["gcode_macro START_PRINT"] %}
  {% set c = printer["gcode_macro _KCTRL_START_CONF"] %}
  {% set band = params.TEMP_BAND|default(0)|int %}
  {% set expected = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (params.PLATE|default(c.plate_id)|int, band, params.PROBE_REV|default(c.probe_rev)|int, params.X_COUNT|default(c.x_count)|int, params.Y_COUNT|default(c.y_count)|int) %}
  {% if sp.active_profile|string == "none" %}
    {action_raise_error("K1 Control: KCTRL_PRODUCTION_ARM has no meaning outside an owned START_PRINT")}
  {% endif %}
  {% if sp.active_profile|string != expected %}
    {action_raise_error("K1 Control: the G-code asks for %s but the start armed %s" % (expected, sp.active_profile))}
  {% endif %}
  _KCTRL_START_VERIFY PROFILE={sp.active_profile} Z={sp.active_z|float} STAGE=gcode_checkpoint


# ---------------------------------------------------------------------------
# End of print: disarm the head switch before the stock unload.
#
# END_PRINT_NO_M84 is where the unload through the cutter happens, and it is the
# only thing that empties the head switch on a perfectly normal end of print.
# Left armed, its runout_gcode fires after the last layer and the machine pauses
# with nothing to resume.
#
# It cannot be wrapped with rename_existing: Klipper merges same-named sections,
# so redefining END_PRINT_NO_M84 here overwrites the stock body instead of
# renaming it, and the rename then finds nothing (key169, seen on 2026-09-02).
# Its two callers are redefined instead, which leaves the stock unload untouched.
#
# CANCEL_PRINT keeps the rename_existing of its stock section - only the gcode
# key is overridden here - so CANCEL_PRINT_BASE still resolves.
[gcode_macro END_PRINT]
gcode:
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=0
  _KCTRL_LOAD_GUARD_OFF
  END_PRINT_NO_M84
  M84

[gcode_macro CANCEL_PRINT]
gcode:
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=0
  _KCTRL_LOAD_GUARD_OFF
  END_PRINT_NO_M84
  CANCEL_PRINT_BASE
