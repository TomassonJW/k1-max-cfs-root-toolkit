# Propriétaire CFS direct K1 Control.
# Cette première pose est volontairement inerte : aucun objet série n'est pris
# et chaque commande d'effet refuse tant que `enabled` reste faux.

[k1_control_cfs_direct_owner]
enabled: false
connected_boxes: 1, 2
head_sensor: filament_switch_sensor filament_sensor
after_cutter_sensor: filament_switch_sensor filament_sensor_2
max_pushes: 8
