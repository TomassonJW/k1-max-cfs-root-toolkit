[k1_control_stock_cycle_owner]
enabled: true

[gcode_macro KCTRL_STOCK_JOB_ASSERT_V1]
description: Assert the stock-derived owner before the first model move
gcode:
  {% set direct = printer.k1_control_cfs_direct_owner %}
  {% set cycle = printer.k1_control_stock_cycle_owner %}
  {% set startup = printer.k1_control_cfs_startup_exclusion %}
  {% set runout = printer.k1_control_cfs_runout_owner %}
  {% if not direct.enabled or not direct.stock_commands_blocked or not cycle.enabled or not startup.ready_verified or not runout.ready_verified or not runout.stock_handler_isolated or not runout.public_box_check_owned or not runout.armed %}
    {action_raise_error("K1 Control stock-derived job owner is not ready")}
  {% endif %}
  {% if printer.box.auto_refill|int != 0 or printer.box.t_command|string != "" %}
    {action_raise_error("K1 Control stock owner exclusion changed")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != "k1_p001_t055_r001_n11x11" %}
    {action_raise_error("K1 Control stock-derived mesh changed")}
  {% endif %}
  {% if (printer.gcode_move.homing_origin.z|float + 0.04)|abs > 0.0005 %}
    {action_raise_error("K1 Control stock-derived accepted Z changed")}
  {% endif %}
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1

[gcode_macro KCTRL_STOCK_JOB_END_V1]
description: Last inert marker; Moonraker owns cutter, unload, park and cooldown
gcode:
  {action_respond_info("K1 Control stock-derived model G-code complete")}

[gcode_macro KCTRL_STOCK_RESUME_OWNED_V1]
description: Reprend le print sans aucun callback BOX stock et a la temperature G-code
gcode:
  {% set target = params.TARGET_C|float %}
  {% if target < 150 or target > 320 %}
    {action_raise_error("K1 Control owned resume target is invalid")}
  {% endif %}
  {% if not printer.pause_resume.is_paused %}
    {action_raise_error("K1 Control owned resume requires a latched pause")}
  {% endif %}
  M109 S{target}
  RESTORE_E_CURRENT
  {% if printer['gcode_macro PRINTER_PARAM'].fan2_speed > 0 %}
    {% set fan2_min = printer['gcode_macro PRINTER_PARAM'].fan2_min|float %}
    {% set fan2 = printer['gcode_macro PRINTER_PARAM'].fan2_speed|float %}
    {% set s_value = (fan2 * 255 - fan2_min) * 255 / (255 - fan2_min) %}
    M106 P2 S{s_value}
  {% endif %}
  {% set safe_pos_y = printer.configfile.settings['box'].safe_pos_y|float %}
  {% if printer.toolhead.position.y|float > safe_pos_y %}
    G90
    G0 Y{safe_pos_y} F1200
    M400
  {% endif %}
  {% set z_resume_move = printer['gcode_macro PRINTER_PARAM'].z_safe_pause|int %}
  {% if z_resume_move > 2 %}
    G91
    G1 Z-{z_resume_move - 2} F600
    G90
    M400
  {% endif %}
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE=0
  RESUME_BASE

[gcode_macro KCTRL_STOCK_CYCLE_EMPTY_END_STATE]
description: Preuve du dernier arret sans filament apres fin de bobine
variable_completed: 0
variable_last_effect_id: "none"
gcode:
  {action_respond_info("K1 Control empty end state")}

[gcode_macro KCTRL_STOCK_CYCLE_EMPTY_END_V1]
description: Ferme sans cutter un print dont la bobine est reellement vide
gcode:
  {% set effect_id = params.EFFECT_ID|string %}
  {% set direct = printer.k1_control_cfs_direct_owner %}
  {% set runout = printer.k1_control_cfs_runout_owner %}
  {% if effect_id|length < 1 or effect_id|length > 96 %}
    {action_raise_error("K1 Control empty end effect id is invalid")}
  {% endif %}
  {% if not printer.pause_resume.is_paused %}
    {action_raise_error("K1 Control empty end requires a latched pause")}
  {% endif %}
  {% if printer.toolhead.homed_axes|string != "xyz" %}
    {action_raise_error("K1 Control empty end requires XYZ references")}
  {% endif %}
  {% if direct.active_route is not none or direct.phase|string != "idle" %}
    {action_raise_error("K1 Control empty end requires logical route release")}
  {% endif %}
  {% if printer['filament_switch_sensor filament_sensor'].filament_detected or printer['filament_switch_sensor filament_sensor_2'].filament_detected %}
    {action_raise_error("K1 Control empty end requires both filament sensors clear")}
  {% endif %}
  {% if runout.event_seq|int != runout.consumed_seq|int %}
    {action_raise_error("K1 Control empty end requires consumed runout")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_STOCK_CYCLE_EMPTY_END_STATE VARIABLE=completed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_STOCK_CYCLE_EMPTY_END_STATE VARIABLE=last_effect_id VALUE='"none"'
  SAVE_GCODE_STATE NAME=KCTRL_STOCK_EMPTY_END
  G91
  G1 Z5 F1200
  G90
  G1 X203 Y273 F1200
  M400
  RESTORE_GCODE_STATE NAME=KCTRL_STOCK_EMPTY_END MOVE=0
  TURN_OFF_HEATERS
  M107 P1
  M107 P2
  SDCARD_RESET_FILE
  M84
  SET_GCODE_VARIABLE MACRO=KCTRL_STOCK_CYCLE_EMPTY_END_STATE VARIABLE=last_effect_id VALUE='"{effect_id}"'
  SET_GCODE_VARIABLE MACRO=KCTRL_STOCK_CYCLE_EMPTY_END_STATE VARIABLE=completed VALUE=1
