# L'ordre est contractuel : l'exclusion capture uniquement le petit handler
# auto_refill avant que le propriétaire direct ferme toutes les surfaces BOX_*.

[k1_control_cfs_startup_exclusion]
enabled: true
box: box

[k1_control_cfs_direct_owner]
enabled: true
connected_boxes: 1, 2
head_sensor: filament_switch_sensor filament_sensor
after_cutter_sensor: filament_switch_sensor filament_sensor_2
max_pushes: 8

# Charge apres le proprietaire direct : il remplace seulement son bloqueur de
# BOX_CHECK_MATERIAL_REFILL par un latch sans effet. Le handler stock original
# reste inaccessible.
[k1_control_cfs_runout_owner]
enabled: true
direct_owner: k1_control_cfs_direct_owner
runout_sensor: filament_switch_sensor filament_sensor_2
head_sensor: filament_switch_sensor filament_sensor
print_stats: print_stats
heater_bed: heater_bed
pause_macro: gcode_macro PRINTER_PARAM
