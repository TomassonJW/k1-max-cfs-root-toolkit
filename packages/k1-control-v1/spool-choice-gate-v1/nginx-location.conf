        # K1 Control: the Bobines page (spool choice before every print).
        # Files live in /usr/data/k1-control-v1/current/www/bobines/; `root`
        # rather than `alias` so the URI maps onto the folder name as is.
        # Without the slash the catch-all would hand out Mainsail instead.
        location = /bobines {
            return 301 /bobines/;
        }

        location /bobines/ {
            root /usr/data/k1-control-v1/current/www;
            index index.html;
            expires -1;
            add_header Cache-Control "no-store" always;
        }
