        # K1 Control: the Bobines page and the window it opens inside Mainsail
        # (spool choice before every print). Files live in
        # /usr/data/k1-control-v1/current/www/bobines/; `root` rather than
        # `alias` so the URI maps onto the folder name as is. Without the
        # slash the catch-all would hand out Mainsail instead. `add_header`
        # in a location drops the server's, so the three are repeated.
        location = /bobines {
            return 301 /bobines/;
        }

        location /bobines/ {
            root /usr/data/k1-control-v1/current/www;
            index index.html;
            expires -1;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy no-referrer always;
        }

        # Mainsail's index.html carries the one script tag that opens the
        # window (mainsail_overlay_patch.py); never cached, so a patch or
        # its removal is seen at the next load. `/` lands here too, through
        # the index directive of the catch-all.
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy no-referrer always;
        }
