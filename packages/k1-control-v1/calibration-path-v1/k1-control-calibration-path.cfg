# OFFLINE CANDIDATE - DO NOT DEPLOY WITHOUT G4-K1-CONTROL-CALIBRATION-PATH-V1
# Exact target: K1 Max S12 structure 0, Creality firmware 2.3.5.34.
# This file adds no heater command, extrusion, CFS call or START_PRINT override.

[gcode_macro KCTRL_CAL_PATH_STATE]
description: Read-only state for the guarded non-extrusion calibration path
variable_ready: 0
variable_phase: "idle"
variable_mesh_ready: 0
variable_mesh_profile: "none"
variable_plate_id: 0
variable_temperature_band_c: 0
variable_probe_revision: 0
variable_x_count: 0
variable_y_count: 0
variable_expected_bed_c: 0.0
variable_expected_nozzle_c: 0.0
variable_motion_armed: 0
variable_current_height_mm: 5.0
variable_commit_ready: 0
gcode:
  {action_respond_info("K1 Control calibration path state is available through Moonraker")}

[gcode_macro KCTRL_CAL_PATH_RESET]
description: Reset an inactive calibration path without moving or changing Z state
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: calibration path reset requires standby")}
  {% endif %}
  {% if path.motion_armed|int == 1 %}
    {action_raise_error("K1 Control: park the calibration path before reset")}
  {% endif %}
  {% if runtime.session_active|int == 1 %}
    {action_raise_error("K1 Control: cancel or commit the active Z session before reset")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=ready VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=phase VALUE='"idle"'
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=mesh_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=mesh_profile VALUE='"none"'
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=plate_id VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=temperature_band_c VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=probe_revision VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=x_count VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=y_count VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=expected_bed_c VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=expected_nozzle_c VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=motion_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=current_height_mm VALUE=5.0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=commit_ready VALUE=0

[gcode_macro KCTRL_CAL_PATH_LOAD_MESH]
description: Load one persisted qualified mesh for a later guarded Z session
gcode:
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% set plate = params.PLATE|int %}
  {% set temp = params.TEMP_BAND|int %}
  {% set probe = params.PROBE_REV|int %}
  {% set x = params.X_COUNT|int %}
  {% set y = params.Y_COUNT|int %}
  {% set bed = params.BED_TEMP|float %}
  {% set nozzle = params.NOZZLE_TEMP|float %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (plate,temp,probe,x,y) %}
  {% if runtime.ready|int != 1 or runtime.session_active|int == 1 %}
    {action_raise_error("K1 Control: runtime is not ready for mesh selection")}
  {% endif %}
  {% if printer.print_stats.state|string != "standby" or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: mesh selection requires standby and homed XYZ")}
  {% endif %}
  {% if plate < 1 or temp < 0 or temp > 150 or probe < 1 or x < 3 or x > 25 or y < 3 or y > 25 %}
    {action_raise_error("K1 Control: invalid calibration mesh identity")}
  {% endif %}
  {% if bed < 0 or bed > 120 or nozzle < 0 or nozzle > 300 %}
    {action_raise_error("K1 Control: invalid calibration temperature context")}
  {% endif %}
  {% if profile not in printer.bed_mesh.profiles %}
    {action_raise_error("K1 Control: qualified calibration mesh is absent")}
  {% endif %}
  BED_MESH_PROFILE LOAD={profile}
  KCTRL_CAL_PATH_VERIFY_MESH PROFILE={profile} PLATE={plate} TEMP_BAND={temp} PROBE_REV={probe} X_COUNT={x} Y_COUNT={y} BED_TEMP={bed} NOZZLE_TEMP={nozzle}

[gcode_macro KCTRL_CAL_PATH_VERIFY_MESH]
description: Verify the loaded mesh and stabilized temperatures before Z calibration
gcode:
  {% set profile = params.PROFILE|string %}
  {% set plate = params.PLATE|int %}
  {% set temp = params.TEMP_BAND|int %}
  {% set probe = params.PROBE_REV|int %}
  {% set x = params.X_COUNT|int %}
  {% set y = params.Y_COUNT|int %}
  {% set bed = params.BED_TEMP|float %}
  {% set nozzle = params.NOZZLE_TEMP|float %}
  {% set expected_profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (plate,temp,probe,x,y) %}
  {% if plate < 1 or temp < 0 or temp > 150 or probe < 1 or x < 3 or x > 25 or y < 3 or y > 25 or profile != expected_profile %}
    {action_raise_error("K1 Control: mesh identity verification failed")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != profile or profile not in printer.bed_mesh.profiles %}
    {action_raise_error("K1 Control: effective calibration mesh verification failed")}
  {% endif %}
  {% if (printer.heater_bed.target|float - bed)|abs > 0.1 or (printer.heater_bed.temperature|float - bed)|abs > 2.0 %}
    {action_raise_error("K1 Control: bed is outside the reviewed calibration band")}
  {% endif %}
  {% if (printer.extruder.target|float - nozzle)|abs > 0.1 or (printer.extruder.temperature|float - nozzle)|abs > 5.0 %}
    {action_raise_error("K1 Control: nozzle is outside the reviewed calibration band")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=ready VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=phase VALUE='"mesh_ready"'
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=mesh_ready VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=mesh_profile VALUE='"{profile}"'
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=plate_id VALUE={plate}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=temperature_band_c VALUE={temp}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=probe_revision VALUE={probe}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=x_count VALUE={x}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=y_count VALUE={y}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=expected_bed_c VALUE={bed}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=expected_nozzle_c VALUE={nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=motion_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=current_height_mm VALUE=5.0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=commit_ready VALUE=0

[gcode_macro KCTRL_CAL_PATH_START_Z]
description: Open the provisional Z session only in the verified mesh context
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% set seed = params.SEED|float %}
  {% set plate = params.PLATE|int %}
  {% set temp = params.TEMP_BAND|int %}
  {% set probe = params.PROBE_REV|int %}
  {% set nozzle = params.NOZZLE_ID|int %}
  {% set config = params.CONFIG_ID|int %}
  {% if path.ready|int != 1 or path.mesh_ready|int != 1 or path.phase|string != "mesh_ready" %}
    {action_raise_error("K1 Control: verified calibration mesh is not ready")}
  {% endif %}
  {% if runtime.session_active|int == 1 or printer.bed_mesh.profile_name|string != path.mesh_profile|string %}
    {action_raise_error("K1 Control: calibration context changed before Z session")}
  {% endif %}
  {% if plate != path.plate_id|int or temp != path.temperature_band_c|int or probe != path.probe_revision|int %}
    {action_raise_error("K1 Control: Z identity does not match the qualified mesh")}
  {% endif %}
  {% if printer.print_stats.state|string != "standby" or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: Z session requires standby and homed XYZ")}
  {% endif %}
  {% if (printer.heater_bed.target|float - path.expected_bed_c|float)|abs > 0.1 or (printer.heater_bed.temperature|float - path.expected_bed_c|float)|abs > 2.0 %}
    {action_raise_error("K1 Control: bed left the qualified band before Z session")}
  {% endif %}
  {% if (printer.extruder.target|float - path.expected_nozzle_c|float)|abs > 0.1 or (printer.extruder.temperature|float - path.expected_nozzle_c|float)|abs > 5.0 %}
    {action_raise_error("K1 Control: nozzle left the qualified band before Z session")}
  {% endif %}
  KCTRL_Z_SESSION_START SEED={seed} PLATE={plate} TEMP_BAND={temp} PROBE_REV={probe} NOZZLE_ID={nozzle} CONFIG_ID={config}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=phase VALUE='"z_session"'
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=commit_ready VALUE=0

[gcode_macro KCTRL_CAL_PATH_BEGIN]
description: Lift, centre and approach only to the reviewed five millimetre start height
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% set clear_plate = params.CLEAR_PLATE|default(0)|int %}
  {% set clean_nozzle = params.CLEAN_NOZZLE|default(0)|int %}
  {% if clear_plate != 1 or clean_nozzle != 1 %}
    {action_raise_error("K1 Control: clear plate and clean nozzle confirmations are required")}
  {% endif %}
  {% if path.ready|int != 1 or path.phase|string != "z_session" or runtime.session_active|int != 1 %}
    {action_raise_error("K1 Control: provisional Z session is not ready for motion")}
  {% endif %}
  {% if printer.print_stats.state|string != "standby" or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: calibration motion requires standby and homed XYZ")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != path.mesh_profile|string %}
    {action_raise_error("K1 Control: calibration mesh changed before motion")}
  {% endif %}
  {% if (printer.heater_bed.target|float - path.expected_bed_c|float)|abs > 0.1 or (printer.heater_bed.temperature|float - path.expected_bed_c|float)|abs > 2.0 %}
    {action_raise_error("K1 Control: bed left the calibration band")}
  {% endif %}
  {% if (printer.extruder.target|float - path.expected_nozzle_c|float)|abs > 0.1 or (printer.extruder.temperature|float - path.expected_nozzle_c|float)|abs > 5.0 %}
    {action_raise_error("K1 Control: nozzle left the calibration band")}
  {% endif %}
  {% if printer.toolhead.position.z|float < -0.001 or printer.toolhead.position.z|float > 50.0 %}
    {action_raise_error("K1 Control: unexpected Z position before calibration approach")}
  {% endif %}
  SAVE_GCODE_STATE NAME=KCTRL_CAL_PATH_MOVE_STATE
  G91
  G1 Z5.0 F600
  G90
  G1 X150.0 Y150.0 F6000
  G1 Z5.0 F600
  RESTORE_GCODE_STATE NAME=KCTRL_CAL_PATH_MOVE_STATE MOVE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=motion_armed VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=phase VALUE='"testing"'
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=current_height_mm VALUE=5.0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=commit_ready VALUE=0

[gcode_macro KCTRL_CAL_PATH_MOVE]
description: Descend through reviewed non-extrusion gauge heights one bounded step at a time
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% set height = params.HEIGHT|float %}
  {% set current = path.current_height_mm|float %}
  {% if path.motion_armed|int != 1 or path.phase|string != "testing" or runtime.session_active|int != 1 %}
    {action_raise_error("K1 Control: calibration motion path is not armed")}
  {% endif %}
  {% if printer.print_stats.state|string != "standby" or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: calibration movement requires standby and homed XYZ")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != path.mesh_profile|string %}
    {action_raise_error("K1 Control: calibration mesh changed during approach")}
  {% endif %}
  {% if (printer.heater_bed.target|float - path.expected_bed_c|float)|abs > 0.1 or (printer.heater_bed.temperature|float - path.expected_bed_c|float)|abs > 2.0 %}
    {action_raise_error("K1 Control: bed left the calibration band during approach")}
  {% endif %}
  {% if (printer.extruder.target|float - path.expected_nozzle_c|float)|abs > 0.1 or (printer.extruder.temperature|float - path.expected_nozzle_c|float)|abs > 5.0 %}
    {action_raise_error("K1 Control: nozzle left the calibration band during approach")}
  {% endif %}
  {% if height not in [5.0,2.0,1.0,0.5,0.3,0.2,0.15,0.1] %}
    {action_raise_error("K1 Control: calibration height is outside the reviewed ladder")}
  {% endif %}
  {% if (current == 5.0 and height < 2.0) or (current == 2.0 and height < 1.0) or (current == 1.0 and height < 0.5) or (current == 0.5 and height < 0.3) or (current == 0.3 and height < 0.2) or (current == 0.2 and height < 0.15) or (current == 0.15 and height < 0.1) %}
    {action_raise_error("K1 Control: calibration descent skipped a required safety step")}
  {% endif %}
  G90
  G1 Z{height} F120
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=current_height_mm VALUE={height}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=commit_ready VALUE=0

[gcode_macro KCTRL_CAL_PATH_ADJUST]
description: Apply a bounded provisional Z increment only at the final gauge height
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% set delta = params.DELTA|float %}
  {% if path.motion_armed|int != 1 or path.phase|string != "testing" or path.current_height_mm|float != 0.1 %}
    {action_raise_error("K1 Control: Z adjustment requires the final reviewed gauge height")}
  {% endif %}
  {% if runtime.session_active|int != 1 %}
    {action_raise_error("K1 Control: provisional Z session is absent")}
  {% endif %}
  {% if printer.print_stats.state|string != "standby" or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: Z adjustment requires standby and homed XYZ")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != path.mesh_profile|string %}
    {action_raise_error("K1 Control: calibration mesh changed before Z adjustment")}
  {% endif %}
  {% if (printer.heater_bed.target|float - path.expected_bed_c|float)|abs > 0.1 or (printer.heater_bed.temperature|float - path.expected_bed_c|float)|abs > 2.0 %}
    {action_raise_error("K1 Control: bed left the calibration band before Z adjustment")}
  {% endif %}
  {% if (printer.extruder.target|float - path.expected_nozzle_c|float)|abs > 0.1 or (printer.extruder.temperature|float - path.expected_nozzle_c|float)|abs > 5.0 %}
    {action_raise_error("K1 Control: nozzle left the calibration band before Z adjustment")}
  {% endif %}
  KCTRL_Z_ADJUST DELTA={delta}
  G90
  G1 Z0.1 F60
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=commit_ready VALUE=0

[gcode_macro KCTRL_CAL_PATH_CONFIRM_GAP]
description: Record the explicit human confirmation of the final non-extrusion gap
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% set confirmed = params.CONFIRMED|int %}
  {% if confirmed != 1 or path.motion_armed|int != 1 or path.phase|string != "testing" or path.current_height_mm|float != 0.1 %}
    {action_raise_error("K1 Control: explicit final gap confirmation is required")}
  {% endif %}
  {% if runtime.session_active|int != 1 %}
    {action_raise_error("K1 Control: provisional Z session is absent")}
  {% endif %}
  {% if printer.print_stats.state|string != "standby" or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: gap confirmation requires standby and homed XYZ")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != path.mesh_profile|string %}
    {action_raise_error("K1 Control: calibration mesh changed before gap confirmation")}
  {% endif %}
  {% if (printer.heater_bed.target|float - path.expected_bed_c|float)|abs > 0.1 or (printer.heater_bed.temperature|float - path.expected_bed_c|float)|abs > 2.0 %}
    {action_raise_error("K1 Control: bed left the calibration band before gap confirmation")}
  {% endif %}
  {% if (printer.extruder.target|float - path.expected_nozzle_c|float)|abs > 0.1 or (printer.extruder.temperature|float - path.expected_nozzle_c|float)|abs > 5.0 %}
    {action_raise_error("K1 Control: nozzle left the calibration band before gap confirmation")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=phase VALUE='"gap_confirmed"'
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=commit_ready VALUE=1

[gcode_macro KCTRL_CAL_PATH_PARK]
description: Lift five millimetres before any Z commit or cancellation
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% if path.motion_armed|int != 1 or path.phase|string not in ["testing", "gap_confirmed"] %}
    {action_raise_error("K1 Control: active calibration motion path is absent")}
  {% endif %}
  {% if runtime.session_active|int != 1 or printer.print_stats.state|string != "standby" or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: cannot park an invalid calibration session")}
  {% endif %}
  SAVE_GCODE_STATE NAME=KCTRL_CAL_PATH_PARK_STATE
  G91
  G1 Z5.0 F600
  RESTORE_GCODE_STATE NAME=KCTRL_CAL_PATH_PARK_STATE MOVE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=motion_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=current_height_mm VALUE={path.current_height_mm|float + 5.0}
  {% if path.commit_ready|int == 1 %}
    SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=phase VALUE='"parked_confirmed"'
  {% else %}
    SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=phase VALUE='"parked_unconfirmed"'
  {% endif %}

[gcode_macro KCTRL_CAL_PATH_COMMIT_Z]
description: Commit Z only after confirmation and a verified safe park
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% set accepted_at = params.ACCEPTED_AT|int %}
  {% if path.commit_ready|int != 1 or path.motion_armed|int != 0 or path.phase|string != "parked_confirmed" %}
    {action_raise_error("K1 Control: confirmed gap and safe park are required before Z commit")}
  {% endif %}
  {% if runtime.session_active|int != 1 or printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: valid standby Z session is required before commit")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != path.mesh_profile|string %}
    {action_raise_error("K1 Control: calibration mesh changed before Z commit")}
  {% endif %}
  {% if (printer.heater_bed.target|float - path.expected_bed_c|float)|abs > 0.1 or (printer.heater_bed.temperature|float - path.expected_bed_c|float)|abs > 2.0 %}
    {action_raise_error("K1 Control: bed left the calibration band before Z commit")}
  {% endif %}
  {% if (printer.extruder.target|float - path.expected_nozzle_c|float)|abs > 0.1 or (printer.extruder.temperature|float - path.expected_nozzle_c|float)|abs > 5.0 %}
    {action_raise_error("K1 Control: nozzle left the calibration band before Z commit")}
  {% endif %}
  KCTRL_Z_COMMIT ACCEPTED_AT={accepted_at}
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=ready VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=phase VALUE='"committed"'
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=mesh_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=motion_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=commit_ready VALUE=0

[gcode_macro KCTRL_CAL_PATH_CANCEL_Z]
description: Cancel a parked or not-yet-moving provisional Z session
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% if path.motion_armed|int == 1 %}
    {action_raise_error("K1 Control: park before cancelling the Z session")}
  {% endif %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: Z cancellation requires standby")}
  {% endif %}
  {% if runtime.session_active|int != 1 or path.phase|string not in ["z_session", "parked_unconfirmed", "parked_confirmed"] %}
    {action_raise_error("K1 Control: cancellable Z session is absent")}
  {% endif %}
  KCTRL_Z_CANCEL
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=ready VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=phase VALUE='"cancelled"'
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=mesh_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=motion_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CAL_PATH_STATE VARIABLE=commit_ready VALUE=0

[gcode_macro KCTRL_CAL_PATH_ASSERT_ARMED]
description: Fail closed unless the bounded non-extrusion calibration path is active
gcode:
  {% set path = printer["gcode_macro KCTRL_CAL_PATH_STATE"] %}
  {% set runtime = printer["gcode_macro KCTRL_STATE"] %}
  {% if path.motion_armed|int != 1 or path.phase|string not in ["testing", "gap_confirmed"] %}
    {action_raise_error("K1 Control: calibration motion path is blocked")}
  {% endif %}
  {% if runtime.session_active|int != 1 or printer.print_stats.state|string != "standby" or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: calibration motion context is invalid")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != path.mesh_profile|string %}
    {action_raise_error("K1 Control: calibration mesh changed after arming")}
  {% endif %}
  {% if (printer.heater_bed.target|float - path.expected_bed_c|float)|abs > 0.1 or (printer.heater_bed.temperature|float - path.expected_bed_c|float)|abs > 2.0 %}
    {action_raise_error("K1 Control: bed left the calibration band after arming")}
  {% endif %}
  {% if (printer.extruder.target|float - path.expected_nozzle_c|float)|abs > 0.1 or (printer.extruder.temperature|float - path.expected_nozzle_c|float)|abs > 5.0 %}
    {action_raise_error("K1 Control: nozzle left the calibration band after arming")}
  {% endif %}
