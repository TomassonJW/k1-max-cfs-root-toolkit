# K1 Control integrated production cycle V1.
# Offline candidate only: the four BOX primitives are not yet physically qualified.

[gcode_macro KCTRL_CYCLE_STATE]
description: Runtime state for the integrated daily production cycle
variable_phase: 'idle'
variable_watchdog_armed: 0
variable_watchdog_deadline: 0.0
variable_load_nozzle: 0.0
variable_unload_nozzle: 0.0
variable_first_nozzle: 0.0
variable_purge_nozzle: 0.0
variable_purge_mm: 0.0
variable_job_id: 'none'
variable_last_effect_target: 0.0
variable_last_effect_owner: 'none'
gcode:
  {action_respond_info("K1 Control cycle phase=%s" % printer["gcode_macro KCTRL_CYCLE_STATE"].phase)}

[delayed_gcode KCTRL_CYCLE_WATCHDOG_V1]
initial_duration: 0
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% if cycle.watchdog_armed|int == 1 %}
    {% if now > cycle.watchdog_deadline|float %}
      TURN_OFF_HEATERS
      M107 P1
      M107 P2
      SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"failed_safe"'
      SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_armed VALUE=0
      SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_deadline VALUE=0.0
      KCTRL_CYCLE_RAISE_V1 CODE=watchdog_timeout
    {% else %}
      UPDATE_DELAYED_GCODE ID=KCTRL_CYCLE_WATCHDOG_V1 DURATION=2
    {% endif %}
  {% endif %}

[gcode_macro KCTRL_CYCLE_PREPARE_V1]
description: Begin one integrated cycle and remove T1A before manual cleaning when needed
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set box = printer.box %}
  {% set unload = params.UNLOAD_NOZZLE|float %}
  {% set load = params.LOAD_NOZZLE|float %}
  {% set first = params.FIRST_NOZZLE|float %}
  {% set purge_nozzle = params.PURGE_NOZZLE|float %}
  {% set purge = params.PURGE_MM|float %}
  {% set job_id = params.JOB|string %}
  {% if cycle.phase|string != "idle" %}
    {action_raise_error("K1 Control: an integrated cycle is already active")}
  {% endif %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: preparation requires standby")}
  {% endif %}
  {% if printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 %}
    {action_raise_error("K1 Control: preparation requires heater targets zero")}
  {% endif %}
  {% if box.state|string != "connect" or box.t_command|string != "" or box.T1.state|string != "connect" or box.T2.state|string != "connect" %}
    {action_raise_error("K1 Control: both CFS units must be stable")}
  {% endif %}
  {% if unload < 150.0 or unload > 320.0 or load < 150.0 or load > 320.0 or first < 150.0 or first > 320.0 or purge_nozzle < 150.0 or purge_nozzle > 320.0 %}
    {action_raise_error("K1 Control: material temperatures are outside the accepted bounds")}
  {% endif %}
  {% if purge < 0.1 or purge > 40.0 or job_id in ["", "none"] %}
    {action_raise_error("K1 Control: job contract is incomplete")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=unload_nozzle VALUE={unload}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=load_nozzle VALUE={load}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=first_nozzle VALUE={first}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=purge_nozzle VALUE={purge_nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=purge_mm VALUE={purge}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=job_id VALUE='"{job_id}"'
  {% if box.T1.filament|string == "A" and box.T2.filament|string in ["None", "none", ""] %}
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected or not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
      {action_raise_error("K1 Control: T1A route and filament sensors disagree")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"unload_before_clean"'
  {% elif box.T1.filament|string in ["None", "none", ""] and box.T2.filament|string in ["None", "none", ""] and printer["filament_switch_sensor filament_sensor"].filament_detected and printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"reconcile_before_clean"'
    {action_respond_info("K1 Control: residual T1A will be re-engaged once, then fully unloaded before cleaning")}
  {% elif box.T1.filament|string in ["None", "none", ""] and box.T2.filament|string in ["None", "none", ""] and not printer["filament_switch_sensor filament_sensor"].filament_detected and not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"await_manual_clean"'
    {action_respond_info("K1 Control: no route engaged; clean the nozzle then continue")}
  {% elif box.T1.filament|string in ["None", "none", ""] and box.T2.filament|string in ["None", "none", ""] %}
    {action_raise_error("K1 Control: residual filament sensor state is ambiguous")}
  {% else %}
    {action_raise_error("K1 Control: only an empty route or one stable T1A route is supported")}
  {% endif %}

[gcode_macro KCTRL_CYCLE_RECONCILE_SLOT_A_BEFORE_CLEAN_V1]
description: Refuse route reconciliation until the direct owner is installed disabled and qualified
gcode:
  {action_raise_error("K1 Control: direct CFS owner is not installed and qualified yet")}

[gcode_macro KCTRL_CYCLE_VERIFY_RECONCILE_SLOT_A_V1]
description: Verify the one residual T1A reconciliation without retry
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set box = printer.box %}
  {% set expected = params.EXPECTED|float %}
  {% if cycle.phase|string != "reconcile_before_clean" %}
    KCTRL_CYCLE_FAIL_V1 CODE=reconcile_state_changed
  {% elif box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_CYCLE_FAIL_V1 CODE=reconcile_T1A_route_unproven
  {% elif not printer["filament_switch_sensor filament_sensor"].filament_detected or not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    KCTRL_CYCLE_FAIL_V1 CODE=reconcile_T1A_sensor_proof_missing
  {% elif (printer.extruder.target|float - expected)|abs > 0.5 %}
    KCTRL_CYCLE_FAIL_V1 CODE=reconcile_temperature_rewritten
  {% else %}
    UPDATE_DELAYED_GCODE ID=KCTRL_CYCLE_WATCHDOG_V1 DURATION=0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_armed VALUE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_deadline VALUE=0.0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"unload_before_clean"'
  {% endif %}

[gcode_macro KCTRL_CYCLE_UNLOAD_BEFORE_CLEAN_V1]
description: Refuse unload until the direct owner is installed and physically qualified
gcode:
  {action_raise_error("K1 Control: direct CFS unload is not physically qualified yet")}

[gcode_macro KCTRL_CYCLE_VERIFY_PRECLEAN_UNLOAD_V1]
description: Verify the pre-clean route release without retry
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set box = printer.box %}
  {% set expected = params.EXPECTED|float %}
  {% if cycle.phase|string != "unload_before_clean" %}
    KCTRL_CYCLE_FAIL_V1 CODE=preclean_unload_state_changed
  {% elif box.t_command|string != "" or box.T1.filament|string not in ["None", "none", ""] or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_CYCLE_FAIL_V1 CODE=preclean_route_release_unproven
  {% elif printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    KCTRL_CYCLE_FAIL_V1 CODE=preclean_after_cutter_not_clear
  {% elif (printer.extruder.target|float - expected)|abs > 0.5 %}
    KCTRL_CYCLE_FAIL_V1 CODE=preclean_temperature_rewritten
  {% else %}
    TURN_OFF_HEATERS
    UPDATE_DELAYED_GCODE ID=KCTRL_CYCLE_WATCHDOG_V1 DURATION=0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_armed VALUE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_deadline VALUE=0.0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"await_manual_clean"'
    {action_respond_info("K1 Control: T1A is retracted; clean the nozzle then continue")}
  {% endif %}

[gcode_macro KCTRL_CYCLE_CONFIRM_CLEAN_AND_REFERENCE_V1]
description: Consume the human clean confirmation and finish every contact reference before T1A load
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set box = printer.box %}
  {% if cycle.phase|string != "await_manual_clean" %}
    {action_raise_error("K1 Control: nozzle cleaning is not expected now")}
  {% endif %}
  {% if box.t_command|string != "" or box.T1.filament|string not in ["None", "none", ""] or box.T2.filament|string not in ["None", "none", ""] %}
    {action_raise_error("K1 Control: contact reference requires no engaged route")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"await_geometry"'
  KCTRL_CONFIRM_MANUAL_NOZZLE_CLEAN_V1
  KCTRL_PREPARE_GEOMETRY_BEFORE_INSERTION_R4 BED=55 PROBE_NOZZLE=140 FIRST_NOZZLE={cycle.first_nozzle} PLATE=1 PROBE_REV=1 NOZZLE_ID=1 CONFIG_ID=1 X_COUNT=11 Y_COUNT=11
  KCTRL_CYCLE_VERIFY_REFERENCE_V1

[gcode_macro KCTRL_CYCLE_VERIFY_REFERENCE_V1]
description: Verify R4 completed XYZ and loaded the accepted 11x11 without a new mesh
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set box = printer.box %}
  {% if cycle.phase|string != "await_geometry" %}
    KCTRL_CYCLE_FAIL_V1 CODE=reference_state_changed
  {% elif owner.phase|string != "geometry_ready_for_insertion" or owner.geometry_ready_token|int != 1 %}
    KCTRL_CYCLE_FAIL_V1 CODE=R4_reference_not_complete
  {% elif "xyz" not in printer.toolhead.homed_axes or state.low_moves_armed|int != 1 %}
    KCTRL_CYCLE_FAIL_V1 CODE=XYZ_or_Z_not_armed
  {% elif printer.bed_mesh.profile_name|string != "k1_p001_t055_r001_n11x11" or (printer.gcode_move.homing_origin.z|float - state.accepted_z_offset|float)|abs > 0.0005 %}
    KCTRL_CYCLE_FAIL_V1 CODE=mesh_or_Z_not_verified
  {% elif box.T1.filament|string not in ["None", "none", ""] or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_CYCLE_FAIL_V1 CODE=route_engaged_during_reference
  {% else %}
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"await_t1a_load"'
    {action_respond_info("K1 Control: XYZ, 11x11 and accepted Z verified; controlled T1A load may start")}
  {% endif %}

[gcode_macro KCTRL_CYCLE_LOAD_SLOT_A_V1]
description: Refuse T1A load until the direct owner is installed and physically qualified
gcode:
  {action_raise_error("K1 Control: direct CFS load is not physically qualified yet")}

[gcode_macro KCTRL_CYCLE_VERIFY_SLOT_A_LOAD_V1]
description: Verify one stable T1A route and consume the pre-insertion geometry token
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set box = printer.box %}
  {% set expected = params.EXPECTED|float %}
  {% if cycle.phase|string != "await_t1a_load" %}
    KCTRL_CYCLE_FAIL_V1 CODE=T1A_load_state_changed
  {% elif box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_CYCLE_FAIL_V1 CODE=T1A_load_unproven
  {% elif not printer["filament_switch_sensor filament_sensor"].filament_detected or not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    KCTRL_CYCLE_FAIL_V1 CODE=T1A_load_sensor_proof_missing
  {% elif (printer.extruder.target|float - expected)|abs > 0.5 %}
    KCTRL_CYCLE_FAIL_V1 CODE=T1A_load_temperature_rewritten
  {% else %}
    UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_token VALUE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_deadline VALUE=0.0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"idle"'
    UPDATE_DELAYED_GCODE ID=KCTRL_CYCLE_WATCHDOG_V1 DURATION=0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_armed VALUE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_deadline VALUE=0.0
    KCTRL_PRODUCTION_ARM PLATE=1 TEMP_BAND=55 PROBE_REV=1 NOZZLE_ID=1 CONFIG_ID=1 X_COUNT=11 Y_COUNT=11
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"await_purge_proof"'
  {% endif %}

[gcode_macro KCTRL_CYCLE_SINGLE_PURGE_V1]
description: Make one short proof line at the origin edge without stock flush or brushing
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set box = printer.box %}
  {% if cycle.phase|string != "await_purge_proof" or box.T1.filament|string != "A" or box.t_command|string != "" %}
    {action_raise_error("K1 Control: the unique T1A purge is not armed")}
  {% endif %}
  {% if state.low_moves_armed|int != 1 or printer.bed_mesh.profile_name|string != "k1_p001_t055_r001_n11x11" %}
    {action_raise_error("K1 Control: mesh and Z are not armed before purge")}
  {% endif %}
  M140 S55
  M104 S{cycle.purge_nozzle}
  M190 S55
  M109 S{cycle.purge_nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=last_effect_target VALUE={cycle.purge_nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=last_effect_owner VALUE='"k1_control"'
  KCTRL_PRODUCTION_ASSERT_ARMED
  SAVE_GCODE_STATE NAME=KCTRL_CYCLE_PURGE_V1
  G90
  M83
  G1 Z5 F1200
  G1 X-1.7 Y20 F6000
  G1 Z0.30 F600
  G1 Y60 E{cycle.purge_mm} F1200
  G1 E-1.2 F1800
  G1 Z5 F1200
  RESTORE_GCODE_STATE NAME=KCTRL_CYCLE_PURGE_V1 MOVE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"camera_purge_check"'
  {action_respond_info("K1 Control: single origin-edge purge complete; camera verdict required")}

[gcode_macro KCTRL_CYCLE_CONFIRM_PURGE_CAMERA_V1]
description: Accept the one purge only after the camera proof is positive
gcode:
  {% set box = printer.box %}
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% if cycle.phase|string != "camera_purge_check" or box.T1.filament|string != "A" or box.t_command|string != "" %}
    {action_raise_error("K1 Control: a positive purge camera verdict is not expected")}
  {% endif %}
  M104 S{cycle.first_nozzle}
  M109 S{cycle.first_nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"ready_to_print"'

[gcode_macro KCTRL_CYCLE_JOB_ASSERT_V1]
description: Atomic Orca start assertion after the integrated preparation
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set box = printer.box %}
  {% if printer.print_stats.state|string != "printing" or cycle.phase|string != "ready_to_print" %}
    {action_raise_error("K1 Control: selected job did not start from the ready state")}
  {% endif %}
  {% if box.T1.filament|string != "A" or box.t_command|string != "" or state.low_moves_armed|int != 1 %}
    {action_raise_error("K1 Control: route or geometry changed before model start")}
  {% endif %}
  {% if printer.bed_mesh.profile_name|string != "k1_p001_t055_r001_n11x11" %}
    {action_raise_error("K1 Control: 11x11 changed before model start")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"printing"'

[gcode_macro KCTRL_CYCLE_END_V1]
description: Refuse normal end until direct CFS unload is physically qualified
gcode:
  {action_raise_error("K1 Control: normal end blocked until direct CFS unload is qualified")}

[gcode_macro KCTRL_CYCLE_VERIFY_END_UNLOAD_V1]
description: Verify the route release, then park, cool and release motors exactly once
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set box = printer.box %}
  {% set expected = params.EXPECTED|float %}
  {% set park_z = params.PARK_Z|float %}
  {% if cycle.phase|string != "ending" %}
    KCTRL_CYCLE_FAIL_V1 CODE=normal_end_state_changed
  {% elif box.t_command|string != "" or box.T1.filament|string not in ["None", "none", ""] or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_CYCLE_FAIL_V1 CODE=normal_end_route_release_unproven
  {% elif printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    KCTRL_CYCLE_FAIL_V1 CODE=normal_end_after_cutter_not_clear
  {% elif (printer.extruder.target|float - expected)|abs > 0.5 %}
    KCTRL_CYCLE_FAIL_V1 CODE=normal_end_temperature_rewritten
  {% else %}
    G90
    G1 Z{park_z} F600
    G1 X203 Y273 F1200
    M400
    TURN_OFF_HEATERS
    M107 P1
    M107 P2
    M84
    UPDATE_DELAYED_GCODE ID=KCTRL_CYCLE_WATCHDOG_V1 DURATION=0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_armed VALUE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_deadline VALUE=0.0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"closed_safe"'
  {% endif %}

[gcode_macro KCTRL_CYCLE_ABORT_V1]
description: Stop the integrated cycle without retrying any uncertain CFS effect
gcode:
  TURN_OFF_HEATERS
  M107 P1
  M107 P2
  UPDATE_DELAYED_GCODE ID=KCTRL_CYCLE_WATCHDOG_V1 DURATION=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"failed_safe"'
  KCTRL_START_ABORT_V1

[gcode_macro KCTRL_CYCLE_RESET_V1]
description: Reset one completed integrated cycle before selecting the next job
gcode:
  {% set cycle = printer["gcode_macro KCTRL_CYCLE_STATE"] %}
  {% set box = printer.box %}
  {% if cycle.phase|string != "closed_safe" or printer.print_stats.state|string not in ["standby", "complete"] %}
    {action_raise_error("K1 Control: only a safely completed cycle can reset")}
  {% elif printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 or box.t_command|string != "" %}
    {action_raise_error("K1 Control: reset requires idle heaters and CFS")}
  {% elif box.T1.filament|string not in ["None", "none", ""] or box.T2.filament|string not in ["None", "none", ""] %}
    {action_raise_error("K1 Control: reset requires an empty route")}
  {% else %}
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"idle"'
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=job_id VALUE='"none"'
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=last_effect_target VALUE=0.0
    SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=last_effect_owner VALUE='"none"'
  {% endif %}

[gcode_macro KCTRL_CYCLE_FAIL_V1]
description: Queue safe shutdown before reporting a cycle failure
gcode:
  {% set code = params.CODE|default("unknown")|string %}
  TURN_OFF_HEATERS
  M107 P1
  M107 P2
  UPDATE_DELAYED_GCODE ID=KCTRL_CYCLE_WATCHDOG_V1 DURATION=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=watchdog_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_CYCLE_STATE VARIABLE=phase VALUE='"failed_safe"'
  KCTRL_CYCLE_RAISE_V1 CODE={code}

[gcode_macro KCTRL_CYCLE_RAISE_V1]
description: Final integrated cycle failure report
gcode:
  {% set code = params.CODE|default("unknown")|string %}
  {action_raise_error("K1 Control integrated cycle blocked: %s" % code)}
