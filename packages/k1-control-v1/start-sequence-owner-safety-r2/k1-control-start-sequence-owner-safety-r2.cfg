# REVIEWED CANDIDATE - DO NOT DEPLOY WITHOUT THE EXACT FROZEN GATE.
# Requires the already installed KCTRL_STATE and KCTRL_PRODUCTION_* macros.
# Deliberately replaces the stock entry point instead of calling it.

[gcode_macro KCTRL_START_OWNER_STATE]
description: Runtime state for the manually cleaned owned start sequence
variable_manual_clean_token: 0
variable_manual_clean_deadline: 0.0
variable_phase: "idle"
variable_watchdog_armed: 0
variable_watchdog_deadline: 0.0
gcode:
  {action_respond_info("K1 Control start owner phase: %s" % printer["gcode_macro KCTRL_START_OWNER_STATE"].phase)}

[gcode_macro KCTRL_CONFIRM_MANUAL_NOZZLE_CLEAN_V1]
description: One-shot human confirmation that the nozzle is visibly clean
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: manual nozzle confirmation requires standby")}
  {% endif %}
  {% if printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 %}
    {action_raise_error("K1 Control: heater targets must be zero before manual clean confirmation")}
  {% endif %}
  {% if owner.watchdog_armed|int != 0 or owner.phase|string != "idle" %}
    {action_raise_error("K1 Control: start owner must be idle before manual clean confirmation")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE={now + 300.0}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"manual_clean_confirmed"'
  {action_respond_info("K1 Control: manual nozzle clean confirmed for one start within five minutes")}

[gcode_macro KCTRL_CLEAR_MANUAL_NOZZLE_CLEAN_V1]
description: Revoke an unused manual-clean confirmation
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% if owner.watchdog_armed|int != 0 %}
    {action_raise_error("K1 Control: an armed start cannot be cleared as an unused confirmation")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"idle"'

[gcode_macro KCTRL_RESET_START_OWNER_V1]
description: Return an aborted cold idle start owner to its initial state
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: start owner reset requires standby")}
  {% endif %}
  {% if printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 %}
    {action_raise_error("K1 Control: start owner reset requires heater targets zero")}
  {% endif %}
  {% if owner.watchdog_armed|int != 0 or owner.phase|string not in ["aborted", "watchdog_aborted", "idle"] %}
    {action_raise_error("K1 Control: start owner reset is allowed only after a closed abort")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"idle"'

[gcode_macro KCTRL_START_WATCHDOG_SELFTEST_V1]
description: Arm the watchdog without heat or motion for installed validation
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% if printer.print_stats.state|string != "standby" or printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 %}
    {action_raise_error("K1 Control: watchdog self-test requires cold standby")}
  {% endif %}
  {% if owner.watchdog_armed|int != 0 or owner.phase|string != "idle" %}
    {action_raise_error("K1 Control: watchdog self-test requires an idle owner")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"selftest_active"'
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 1.0}
  UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=1

[delayed_gcode KCTRL_START_WATCHDOG_V1]
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set phase = owner.phase|string %}
  {% if owner.watchdog_armed|int == 1 %}
    {% if phase in ["model_ready", "idle", "aborted", "watchdog_aborted"] %}
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
    {% elif printer.print_stats.state|string != "printing" or now >= owner.watchdog_deadline|float %}
      TURN_OFF_HEATERS
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"watchdog_aborted"'
      {% if phase != "selftest_active" %}
        SET_GCODE_VARIABLE MACRO=KCTRL_STATE VARIABLE=low_moves_armed VALUE=0
        SET_GCODE_VARIABLE MACRO=KCTRL_STATE VARIABLE=armed_mesh_profile VALUE='"none"'
      {% endif %}
    {% else %}
      UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=5
    {% endif %}
  {% endif %}

[gcode_macro KCTRL_START_ABORT_V1]
description: Stop heating and close the owned start without stock cleanup
gcode:
  TURN_OFF_HEATERS
  UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"aborted"'
  SET_GCODE_VARIABLE MACRO=KCTRL_STATE VARIABLE=low_moves_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_STATE VARIABLE=armed_mesh_profile VALUE='"none"'

[gcode_macro KCTRL_START_FAIL_AFTER_HEAT_V1]
description: Guaranteed heater shutdown before reporting a start failure
gcode:
  {% set code = params.CODE|default("unknown")|string %}
  KCTRL_START_ABORT_V1
  KCTRL_START_RAISE_V1 CODE={code}

[gcode_macro KCTRL_START_RAISE_V1]
description: Final failure report after queued safety actions
gcode:
  {% set code = params.CODE|default("unknown")|string %}
  {action_raise_error("K1 Control owned start blocked: %s" % code)}

[gcode_macro KCTRL_JOB_BEGIN_KEEP_CORRECT_V1]
description: Owned start for the already engaged and correct T1A route only
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set box = printer.box %}
  {% set bed = params.BED|float %}
  {% set probe_nozzle = params.PROBE_NOZZLE|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% set plate = params.PLATE|int %}
  {% set probe = params.PROBE_REV|int %}
  {% set nozzle = params.NOZZLE_ID|int %}
  {% set config = params.CONFIG_ID|int %}
  {% set x = params.X_COUNT|int %}
  {% set y = params.Y_COUNT|int %}
  {% set temp = bed|int %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (plate,temp,probe,x,y) %}
  {% if owner.manual_clean_token|int != 1 or owner.phase|string != "manual_clean_confirmed" or now > owner.manual_clean_deadline|float %}
    {action_raise_error("K1 Control: fresh manual nozzle clean confirmation is missing")}
  {% endif %}
  {% if owner.watchdog_armed|int != 0 %}
    {action_raise_error("K1 Control: a previous start watchdog is still armed")}
  {% endif %}
  {% if printer.print_stats.state|string != "printing" %}
    {action_raise_error("K1 Control: owned job start must be called by a running virtual SD job")}
  {% endif %}
  {% if bed != 55.0 or probe_nozzle != 140.0 or first_nozzle != 190.0 %}
    {action_raise_error("K1 Control: only the reviewed 55/140/190 temperature set is accepted")}
  {% endif %}
  {% if plate != 1 or probe != 1 or nozzle != 1 or config != 1 or x != 11 or y != 11 %}
    {action_raise_error("K1 Control: job context differs from the reviewed 11x11 context")}
  {% endif %}
  {% if state.accepted_z_valid|int != 1 or state.session_active|int == 1 or profile not in printer.bed_mesh.profiles %}
    {action_raise_error("K1 Control: accepted Z or requested persistent mesh is unavailable")}
  {% endif %}
  {% if state.plate_id|int != plate or state.temperature_band_c|int != temp or state.probe_revision|int != probe or state.nozzle_id|int != nozzle or state.config_id|int != config %}
    {action_raise_error("K1 Control: accepted Z context differs from the reviewed job")}
  {% endif %}
  {% if box.state|string != "connect" or box.t_command|string != "" or box.T1.state|string != "connect" or box.T2.state|string != "connect" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    {action_raise_error("K1 Control: V1 requires one stable T1A route and no CFS command")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"reference_heating"'
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 600.0}
  UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=5
  M140 S{bed}
  M104 S{probe_nozzle}
  G28 X Y
  M190 S{bed}
  M109 S{probe_nozzle}
  ACCURATE_G28
  KCTRL_START_AFTER_REFERENCE_V1 BED={bed} FIRST_NOZZLE={first_nozzle} PLATE={plate} PROBE_REV={probe} NOZZLE_ID={nozzle} CONFIG_ID={config} X_COUNT={x} Y_COUNT={y}

[gcode_macro KCTRL_START_AFTER_REFERENCE_V1]
description: Recheck the route and arm persistent geometry after the single Z reference
gcode:
  {% set box = printer.box %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set bed = params.BED|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% set plate = params.PLATE|int %}
  {% set probe = params.PROBE_REV|int %}
  {% set nozzle = params.NOZZLE_ID|int %}
  {% set config = params.CONFIG_ID|int %}
  {% set x = params.X_COUNT|int %}
  {% set y = params.Y_COUNT|int %}
  {% set temp = bed|int %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (plate,temp,probe,x,y) %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"post_reference_check"'
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 120.0}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=missing_xyz_after_reference
  {% elif box.state|string != "connect" or box.t_command|string != "" or box.T1.state|string != "connect" or box.T2.state|string != "connect" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_changed_during_reference
  {% elif state.accepted_z_valid|int != 1 or state.session_active|int == 1 or profile not in printer.bed_mesh.profiles %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_context_changed_during_reference
  {% elif state.plate_id|int != plate or state.temperature_band_c|int != temp or state.probe_revision|int != probe or state.nozzle_id|int != nozzle or state.config_id|int != config %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=accepted_z_context_changed_during_reference
  {% else %}
    KCTRL_PRODUCTION_ARM PLATE={plate} TEMP_BAND={temp} PROBE_REV={probe} NOZZLE_ID={nozzle} CONFIG_ID={config} X_COUNT={x} Y_COUNT={y}
    KCTRL_START_AFTER_ARM_V1 FIRST_NOZZLE={first_nozzle}
  {% endif %}

[gcode_macro KCTRL_START_AFTER_ARM_V1]
description: Verify armed geometry, reach the explicit print temperature and continue
gcode:
  {% set box = printer.box %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% if box.state|string != "connect" or box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_changed_after_geometry_arm
  {% elif state.low_moves_armed|int != 1 or state.accepted_z_valid|int != 1 or "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_not_armed
  {% elif (printer.gcode_move.homing_origin.z|float - state.accepted_z_offset|float)|abs > 0.0005 or printer.bed_mesh.profile_name|string != state.armed_mesh_profile|string %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_verification_failed
  {% else %}
    KCTRL_PRODUCTION_ASSERT_ARMED
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"first_layer_heating"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 180.0}
    M104 S{first_nozzle}
    M109 S{first_nozzle}
    KCTRL_START_VISIBLE_PURGE_V1 FIRST_NOZZLE={first_nozzle}
  {% endif %}

[gcode_macro KCTRL_START_VISIBLE_PURGE_V1]
description: One reviewed visible prime line after the final geometry and route checks
gcode:
  {% set box = printer.box %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% if box.state|string != "connect" or box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_changed_before_purge
  {% elif state.low_moves_armed|int != 1 or state.accepted_z_valid|int != 1 or "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_disarmed_before_purge
  {% elif (printer.gcode_move.homing_origin.z|float - state.accepted_z_offset|float)|abs > 0.0005 or printer.bed_mesh.profile_name|string != state.armed_mesh_profile|string %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_changed_before_purge
  {% elif (printer.extruder.temperature|float - first_nozzle)|abs > 5.0 or printer.heater_bed.temperature|float < 53.0 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=explicit_print_temperature_not_reached
  {% else %}
    KCTRL_PRODUCTION_ASSERT_ARMED
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"visible_purge"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 60.0}
    SAVE_GCODE_STATE NAME=KCTRL_START_PRIME_V1
    G90
    M83
    G1 Z5 F1200
    G1 X0.1 Y20 F6000
    G1 Z0.30 F600
    G1 Y180 E10 F3000
    G1 X0.4 Y180 F3000
    G1 Y20 E10 F3000
    G1 Y10 F3000
    G1 E-1.2 F1800
    G1 Z5 F1200
    RESTORE_GCODE_STATE NAME=KCTRL_START_PRIME_V1 MOVE=0
    UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"model_ready"'
  {% endif %}
