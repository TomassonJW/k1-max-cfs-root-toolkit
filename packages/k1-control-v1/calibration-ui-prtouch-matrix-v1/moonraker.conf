# K1-CONTROL-V1 offline candidate. NEVER copy before a named G4 GO.
[server]
host: 127.0.0.1
port: 7125
klippy_uds_address: /tmp/klippy_uds
max_upload_size: 1024

[authorization]
trusted_clients:
  127.0.0.1
force_logins: False
enable_api_key: False

[machine]
provider: none
validate_service: False
validate_config: False

[file_manager]
enable_config_write_access: False
enable_object_processing: True
queue_gcode_uploads: False

[data_store]
temperature_store_size: 600
gcode_store_size: 200

[job_state]

[history]

[k1_control]
state_path: /usr/data/k1-control-v1/state/k1-control-calibration-workflow.json
printer_config_path: /usr/data/printer_data/config/printer.cfg
z_state_path: /usr/data/k1-control-v1/state/k1-control-z-state.json
backup_root: /usr/data/k1-control-v1/backups/calibration-ui-v1

[k1_control_probe_count]
