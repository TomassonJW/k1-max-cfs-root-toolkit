# R4 OFFLINE CANDIDATE - DO NOT DEPLOY OR RUN PHYSICALLY.
# Requires the already installed KCTRL_STATE and KCTRL_PRODUCTION_* macros.
# Contact geometry is completed without filament before the official insertion.
# The print start after insertion never homes or probes Z.

[gcode_macro KCTRL_START_OWNER_STATE]
description: Runtime state for the manually cleaned owned start sequence
variable_manual_clean_token: 0
variable_manual_clean_deadline: 0.0
variable_geometry_ready_token: 0
variable_geometry_ready_deadline: 0.0
variable_phase: "idle"
variable_watchdog_armed: 0
variable_watchdog_deadline: 0.0
variable_job_bed: 0.0
variable_job_probe_nozzle: 0.0
variable_job_first_nozzle: 0.0
variable_job_plate: 0
variable_job_probe_rev: 0
variable_job_nozzle_id: 0
variable_job_config_id: 0
variable_job_x_count: 0
variable_job_y_count: 0
gcode:
  {action_respond_info("K1 Control start owner phase: %s" % printer["gcode_macro KCTRL_START_OWNER_STATE"].phase)}

[gcode_macro KCTRL_CONFIRM_MANUAL_NOZZLE_CLEAN_V1]
description: One-shot human confirmation that the nozzle is visibly clean
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: manual nozzle confirmation requires standby")}
  {% endif %}
  {% if printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 %}
    {action_raise_error("K1 Control: heater targets must be zero before manual clean confirmation")}
  {% endif %}
  {% if owner.watchdog_armed|int != 0 or owner.phase|string != "idle" %}
    {action_raise_error("K1 Control: start owner must be idle before manual clean confirmation")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE={now + 300.0}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"manual_clean_confirmed"'
  {action_respond_info("K1 Control: manual nozzle clean confirmed for one start within five minutes")}

[gcode_macro KCTRL_CLEAR_MANUAL_NOZZLE_CLEAN_V1]
description: Revoke an unused manual-clean confirmation
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% if owner.watchdog_armed|int != 0 %}
    {action_raise_error("K1 Control: an armed start cannot be cleared as an unused confirmation")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"idle"'

[gcode_macro KCTRL_RESET_START_OWNER_V1]
description: Return an aborted cold idle start owner to its initial state
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: start owner reset requires standby")}
  {% endif %}
  {% if printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 %}
    {action_raise_error("K1 Control: start owner reset requires heater targets zero")}
  {% endif %}
  {% if owner.watchdog_armed|int != 0 or owner.phase|string not in ["aborted", "watchdog_aborted", "idle"] %}
    {action_raise_error("K1 Control: start owner reset is allowed only after a closed abort")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"idle"'

[gcode_macro KCTRL_START_WATCHDOG_SELFTEST_V1]
description: Arm the watchdog without heat or motion for installed validation
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% if printer.print_stats.state|string != "standby" or printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 %}
    {action_raise_error("K1 Control: watchdog self-test requires cold standby")}
  {% endif %}
  {% if owner.watchdog_armed|int != 0 or owner.phase|string != "idle" %}
    {action_raise_error("K1 Control: watchdog self-test requires an idle owner")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"selftest_active"'
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 1.0}
  UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=1

[delayed_gcode KCTRL_START_WATCHDOG_V1]
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set phase = owner.phase|string %}
  {% if owner.watchdog_armed|int == 1 %}
    {% if phase in ["model_ready", "idle", "aborted", "watchdog_aborted"] %}
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
    {% elif now >= owner.watchdog_deadline|float or (printer.print_stats.state|string != "printing" and not (printer.print_stats.state|string == "paused" and phase in ["camera_release_check", "first_layer_heating", "visible_purge", "camera_prime_check"]) and not (printer.print_stats.state|string == "standby" and phase in ["geometry_heating", "geometry_arming", "geometry_ready_for_insertion", "geometry_reuse_arming", "geometry_ready_with_engaged_t1a", "selftest_active"])) %}
      TURN_OFF_HEATERS
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_token VALUE=0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_deadline VALUE=0.0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
      SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"watchdog_aborted"'
      {% if phase != "selftest_active" %}
        SET_GCODE_VARIABLE MACRO=KCTRL_STATE VARIABLE=low_moves_armed VALUE=0
        SET_GCODE_VARIABLE MACRO=KCTRL_STATE VARIABLE=armed_mesh_profile VALUE='"none"'
      {% endif %}
    {% else %}
      UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=5
    {% endif %}
  {% endif %}

[gcode_macro KCTRL_START_ABORT_V1]
description: Stop heating and close the owned start without stock cleanup
gcode:
  TURN_OFF_HEATERS
  UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"aborted"'
  SET_GCODE_VARIABLE MACRO=KCTRL_STATE VARIABLE=low_moves_armed VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_STATE VARIABLE=armed_mesh_profile VALUE='"none"'

[gcode_macro KCTRL_START_FAIL_AFTER_HEAT_V1]
description: Guaranteed heater shutdown before reporting a start failure
gcode:
  {% set code = params.CODE|default("unknown")|string %}
  KCTRL_START_ABORT_V1
  KCTRL_START_RAISE_V1 CODE={code}

[gcode_macro KCTRL_START_RAISE_V1]
description: Final failure report after queued safety actions
gcode:
  {% set code = params.CODE|default("unknown")|string %}
  {action_raise_error("K1 Control owned start blocked: %s" % code)}

[gcode_macro KCTRL_PREPARE_GEOMETRY_BEFORE_INSERTION_R4]
description: Complete every contact reference with no engaged filament, then wait for official insertion
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set box = printer.box %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set bed = params.BED|float %}
  {% set probe_nozzle = params.PROBE_NOZZLE|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% set plate = params.PLATE|int %}
  {% set probe = params.PROBE_REV|int %}
  {% set nozzle = params.NOZZLE_ID|int %}
  {% set config = params.CONFIG_ID|int %}
  {% set x = params.X_COUNT|int %}
  {% set y = params.Y_COUNT|int %}
  {% set temp = bed|int %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (plate,temp,probe,x,y) %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: pre-insertion geometry requires standby")}
  {% endif %}
  {% if printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 %}
    {action_raise_error("K1 Control: pre-insertion geometry must start with heater targets zero")}
  {% endif %}
  {% if owner.manual_clean_token|int != 1 or owner.phase|string != "manual_clean_confirmed" or now > owner.manual_clean_deadline|float %}
    {action_raise_error("K1 Control: fresh manual nozzle clean confirmation is missing")}
  {% endif %}
  {% if owner.watchdog_armed|int != 0 or owner.geometry_ready_token|int != 0 %}
    {action_raise_error("K1 Control: a previous geometry preparation is still active")}
  {% endif %}
  {% if bed != 55.0 or probe_nozzle != 140.0 or first_nozzle != 190.0 %}
    {action_raise_error("K1 Control: only the reviewed 55/140/190 temperature set is accepted")}
  {% endif %}
  {% if plate != 1 or probe != 1 or nozzle != 1 or config != 1 or x != 11 or y != 11 %}
    {action_raise_error("K1 Control: geometry context differs from the reviewed 11x11 context")}
  {% endif %}
  {% if state.accepted_z_valid|int != 1 or state.session_active|int == 1 or profile not in printer.bed_mesh.profiles %}
    {action_raise_error("K1 Control: accepted Z or requested persistent mesh is unavailable")}
  {% endif %}
  {% if state.plate_id|int != plate or state.temperature_band_c|int != temp or state.probe_revision|int != probe or state.nozzle_id|int != nozzle or state.config_id|int != config %}
    {action_raise_error("K1 Control: accepted Z context differs from the reviewed job")}
  {% endif %}
  {% if box.state|string != "connect" or box.t_command|string != "" or box.T1.state|string != "connect" or box.T2.state|string != "connect" or box.T1.filament|string not in ["None", "none", ""] or box.T2.filament|string not in ["None", "none", ""] %}
    {action_raise_error("K1 Control: every contact reference requires no engaged CFS route")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"geometry_heating"'
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 600.0}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_bed VALUE={bed}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_probe_nozzle VALUE={probe_nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_first_nozzle VALUE={first_nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_plate VALUE={plate}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_probe_rev VALUE={probe}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_nozzle_id VALUE={nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_config_id VALUE={config}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_x_count VALUE={x}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_y_count VALUE={y}
  UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=5
  M140 S{bed}
  M104 S{probe_nozzle}
  G28 X Y
  M190 S{bed}
  M109 S{probe_nozzle}
  ACCURATE_G28
  KCTRL_AFTER_GEOMETRY_BEFORE_INSERTION_R4 BED={bed} PLATE={plate} PROBE_REV={probe} NOZZLE_ID={nozzle} CONFIG_ID={config} X_COUNT={x} Y_COUNT={y}

[gcode_macro KCTRL_AFTER_GEOMETRY_BEFORE_INSERTION_R4]
description: Arm and verify the accepted geometry while the CFS route is still empty
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set box = printer.box %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set bed = params.BED|float %}
  {% set plate = params.PLATE|int %}
  {% set probe = params.PROBE_REV|int %}
  {% set nozzle = params.NOZZLE_ID|int %}
  {% set config = params.CONFIG_ID|int %}
  {% set x = params.X_COUNT|int %}
  {% set y = params.Y_COUNT|int %}
  {% set temp = bed|int %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (plate,temp,probe,x,y) %}
  {% if owner.phase|string != "geometry_heating" or owner.watchdog_armed|int != 1 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_preparation_state_changed
  {% elif box.state|string != "connect" or box.t_command|string != "" or box.T1.filament|string not in ["None", "none", ""] or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_engaged_during_contact_reference
  {% elif "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=contact_reference_did_not_finish
  {% elif state.accepted_z_valid|int != 1 or state.session_active|int == 1 or profile not in printer.bed_mesh.profiles %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_context_changed_during_contact_reference
  {% else %}
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"geometry_arming"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 120.0}
    KCTRL_PRODUCTION_ARM PLATE={plate} TEMP_BAND={temp} PROBE_REV={probe} NOZZLE_ID={nozzle} CONFIG_ID={config} X_COUNT={x} Y_COUNT={y}
    KCTRL_MARK_GEOMETRY_READY_FOR_INSERTION_R4 PROFILE={profile}
  {% endif %}

[gcode_macro KCTRL_MARK_GEOMETRY_READY_FOR_INSERTION_R4]
description: Close contact work, turn heaters off and open a ten-minute official-insertion window
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set box = printer.box %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set profile = params.PROFILE|string %}
  {% if owner.phase|string != "geometry_arming" or owner.watchdog_armed|int != 1 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_arm_state_changed
  {% elif box.t_command|string != "" or box.T1.filament|string not in ["None", "none", ""] or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_engaged_before_geometry_ready
  {% elif state.low_moves_armed|int != 1 or state.accepted_z_valid|int != 1 or "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_not_armed_before_insertion
  {% elif printer.bed_mesh.profile_name|string != profile or (printer.gcode_move.homing_origin.z|float - state.accepted_z_offset|float)|abs > 0.0005 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_verification_failed_before_insertion
  {% else %}
    TURN_OFF_HEATERS
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_token VALUE=1
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_deadline VALUE={now + 600.0}
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"geometry_ready_for_insertion"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 600.0}
    {action_respond_info("K1 Control: contact geometry is complete; insert T1A with the official function within ten minutes")}
  {% endif %}

[gcode_macro KCTRL_REUSE_VALID_GEOMETRY_WITH_T1A_R4]
description: Keep an already engaged T1A when the existing XYZ, mesh and accepted Z remain valid
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set box = printer.box %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set bed = params.BED|float %}
  {% set probe_nozzle = params.PROBE_NOZZLE|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% set plate = params.PLATE|int %}
  {% set probe = params.PROBE_REV|int %}
  {% set nozzle = params.NOZZLE_ID|int %}
  {% set config = params.CONFIG_ID|int %}
  {% set x = params.X_COUNT|int %}
  {% set y = params.Y_COUNT|int %}
  {% set temp = bed|int %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (plate,temp,probe,x,y) %}
  {% if printer.print_stats.state|string != "standby" %}
    {action_raise_error("K1 Control: geometry reuse requires standby")}
  {% endif %}
  {% if printer.extruder.target|float != 0.0 or printer.heater_bed.target|float != 0.0 %}
    {action_raise_error("K1 Control: geometry reuse must start with heater targets zero")}
  {% endif %}
  {% if owner.manual_clean_token|int != 1 or owner.phase|string != "manual_clean_confirmed" or now > owner.manual_clean_deadline|float %}
    {action_raise_error("K1 Control: fresh manual nozzle clean confirmation is missing")}
  {% endif %}
  {% if owner.watchdog_armed|int != 0 or owner.geometry_ready_token|int != 0 %}
    {action_raise_error("K1 Control: another owned start preparation is active")}
  {% endif %}
  {% if bed != 55.0 or probe_nozzle != 140.0 or first_nozzle != 190.0 %}
    {action_raise_error("K1 Control: only the reviewed 55/140/190 temperature set is accepted")}
  {% endif %}
  {% if plate != 1 or probe != 1 or nozzle != 1 or config != 1 or x != 11 or y != 11 %}
    {action_raise_error("K1 Control: geometry context differs from the reviewed 11x11 context")}
  {% endif %}
  {% if state.accepted_z_valid|int != 1 or state.session_active|int == 1 or profile not in printer.bed_mesh.profiles or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: reusable XYZ, accepted Z or persistent mesh is unavailable")}
  {% endif %}
  {% if state.plate_id|int != plate or state.temperature_band_c|int != temp or state.probe_revision|int != probe or state.nozzle_id|int != nozzle or state.config_id|int != config %}
    {action_raise_error("K1 Control: accepted Z context differs from the reviewed job")}
  {% endif %}
  {% if box.state|string != "connect" or box.t_command|string != "" or box.T1.state|string != "connect" or box.T2.state|string != "connect" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    {action_raise_error("K1 Control: geometry reuse requires one stable T1A route")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=manual_clean_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"geometry_reuse_arming"'
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=1
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 120.0}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_bed VALUE={bed}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_probe_nozzle VALUE={probe_nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_first_nozzle VALUE={first_nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_plate VALUE={plate}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_probe_rev VALUE={probe}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_nozzle_id VALUE={nozzle}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_config_id VALUE={config}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_x_count VALUE={x}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=job_y_count VALUE={y}
  UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=5
  KCTRL_PRODUCTION_ARM PLATE={plate} TEMP_BAND={temp} PROBE_REV={probe} NOZZLE_ID={nozzle} CONFIG_ID={config} X_COUNT={x} Y_COUNT={y}
  KCTRL_MARK_REUSED_GEOMETRY_READY_R4 PROFILE={profile}

[gcode_macro KCTRL_MARK_REUSED_GEOMETRY_READY_R4]
description: Verify reusable geometry and open one start without unloading or probing
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set box = printer.box %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set profile = params.PROFILE|string %}
  {% if owner.phase|string != "geometry_reuse_arming" or owner.watchdog_armed|int != 1 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_reuse_state_changed
  {% elif box.state|string != "connect" or box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_changed_during_geometry_reuse
  {% elif state.low_moves_armed|int != 1 or state.accepted_z_valid|int != 1 or "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=reused_geometry_not_armed
  {% elif printer.bed_mesh.profile_name|string != profile or (printer.gcode_move.homing_origin.z|float - state.accepted_z_offset|float)|abs > 0.0005 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=reused_geometry_verification_failed
  {% else %}
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_token VALUE=1
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_deadline VALUE={now + 600.0}
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"geometry_ready_with_engaged_t1a"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 600.0}
    {action_respond_info("K1 Control: existing XYZ, 11x11 and accepted Z verified; start the job within ten minutes without unloading or probing")}
  {% endif %}

[gcode_macro KCTRL_JOB_BEGIN_KEEP_CORRECT_V1]
description: Start with T1A after fresh pre-insertion geometry or verified reusable geometry; never probe after insertion
gcode:
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set box = printer.box %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set bed = params.BED|float %}
  {% set probe_nozzle = params.PROBE_NOZZLE|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% set plate = params.PLATE|int %}
  {% set probe = params.PROBE_REV|int %}
  {% set nozzle = params.NOZZLE_ID|int %}
  {% set config = params.CONFIG_ID|int %}
  {% set x = params.X_COUNT|int %}
  {% set y = params.Y_COUNT|int %}
  {% set temp = bed|int %}
  {% set profile = "k1_p%03d_t%03d_r%03d_n%02dx%02d" % (plate,temp,probe,x,y) %}
  {% if printer.print_stats.state|string != "printing" %}
    {action_raise_error("K1 Control: owned job start must be called by a running virtual SD job")}
  {% endif %}
  {% if owner.geometry_ready_token|int != 1 or owner.phase|string not in ["geometry_ready_for_insertion", "geometry_ready_with_engaged_t1a"] or owner.watchdog_armed|int != 1 or now > owner.geometry_ready_deadline|float %}
    {action_raise_error("K1 Control: fresh or verified reusable geometry token is missing or expired")}
  {% endif %}
  {% if bed != 55.0 or probe_nozzle != 140.0 or first_nozzle != 190.0 %}
    {action_raise_error("K1 Control: only the reviewed 55/140/190 temperature set is accepted")}
  {% endif %}
  {% if plate != 1 or probe != 1 or nozzle != 1 or config != 1 or x != 11 or y != 11 %}
    {action_raise_error("K1 Control: job context differs from the reviewed 11x11 context")}
  {% endif %}
  {% if state.accepted_z_valid|int != 1 or state.session_active|int == 1 or profile not in printer.bed_mesh.profiles or "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("K1 Control: prepared geometry is no longer available")}
  {% endif %}
  {% if state.plate_id|int != plate or state.temperature_band_c|int != temp or state.probe_revision|int != probe or state.nozzle_id|int != nozzle or state.config_id|int != config %}
    {action_raise_error("K1 Control: accepted Z context differs from the reviewed job")}
  {% endif %}
  {% if box.state|string != "connect" or box.t_command|string != "" or box.T1.state|string != "connect" or box.T2.state|string != "connect" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    {action_raise_error("K1 Control: R4 requires one stable T1A route after official insertion")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_token VALUE=0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=geometry_ready_deadline VALUE=0.0
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"post_insertion_geometry_restore"'
  SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 180.0}
  KCTRL_PRODUCTION_ARM PLATE={plate} TEMP_BAND={temp} PROBE_REV={probe} NOZZLE_ID={nozzle} CONFIG_ID={config} X_COUNT={x} Y_COUNT={y}
  KCTRL_START_AFTER_REARM_R4 FIRST_NOZZLE={first_nozzle} RELEASE_NOZZLE={probe_nozzle}

[gcode_macro KCTRL_START_AFTER_REARM_R4]
description: Verify geometry after official insertion, then heat without any homing or contact probe
gcode:
  {% set box = printer.box %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% set release_nozzle = params.RELEASE_NOZZLE|float %}
  {% if owner.phase|string != "post_insertion_geometry_restore" or owner.watchdog_armed|int != 1 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=post_insertion_geometry_state_changed
  {% elif box.state|string != "connect" or box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_changed_after_official_insertion
  {% elif state.low_moves_armed|int != 1 or state.accepted_z_valid|int != 1 or "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_not_armed_after_insertion
  {% elif (printer.gcode_move.homing_origin.z|float - state.accepted_z_offset|float)|abs > 0.0005 or printer.bed_mesh.profile_name|string != state.armed_mesh_profile|string %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_verification_failed_after_insertion
  {% else %}
    KCTRL_PRODUCTION_ASSERT_ARMED
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"purge_heating"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 480.0}
    M140 S{owner.job_bed}
    M104 S{first_nozzle}
    M190 S{owner.job_bed}
    M109 S{first_nozzle}
    KCTRL_START_BIN_PURGE_AND_RELEASE_R4 FIRST_NOZZLE={first_nozzle} RELEASE_NOZZLE={release_nozzle}
  {% endif %}

[gcode_macro KCTRL_START_BIN_PURGE_AND_RELEASE_R4]
description: Purge after all contact work, release the blob and stop for camera review
gcode:
  {% set box = printer.box %}
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% set release_nozzle = params.RELEASE_NOZZLE|float %}
  {% if box.state|string != "connect" or box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_changed_before_bin_purge
  {% elif "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=pre_insertion_geometry_missing_before_bin_purge
  {% elif (printer.extruder.temperature|float - first_nozzle)|abs > 5.0 or printer.heater_bed.temperature|float < 53.0 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=bin_purge_temperature_not_reached
  {% else %}
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"bin_purge_and_release"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 240.0}
    KCTRL_PRODUCTION_ASSERT_ARMED
    SAVE_GCODE_STATE NAME=KCTRL_START_BIN_PURGE_R4
    G90
    M83
    G1 Z32 F600
    G1 X185.5 Y305 F1200
    G1 Z30 F600
    G1 E20 F360
    G1 E-1.2 F1800
    M104 S{release_nozzle}
    G1 Z32 F600
    M109 S{release_nozzle}
    G1 X203 Y273 F1200
    G1 Y305 F600
    G1 X206 F180
    G1 X203 F180
    G1 Y304 F180
    G1 X206 F180
    G1 X203 F180
    G1 X203 Y273 F1200
    RESTORE_GCODE_STATE NAME=KCTRL_START_BIN_PURGE_R4 MOVE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"camera_release_check"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 300.0}
    PAUSE_BASE
  {% endif %}

[gcode_macro KCTRL_CONFIRM_CAMERA_RELEASE_AND_PRIME_R4]
description: Continue to the outside-bed prime after the camera proves a released blob and clean nozzle
gcode:
  {% set box = printer.box %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% if printer.print_stats.state|string != "paused" or printer.pause_resume.is_paused|lower != "true" %}
    {action_raise_error("K1 Control: camera release confirmation requires the held print")}
  {% elif owner.phase|string != "camera_release_check" or owner.watchdog_armed|int != 1 %}
    {action_raise_error("K1 Control: camera release confirmation is not expected")}
  {% elif box.state|string != "connect" or box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_changed_during_camera_release_check
  {% elif state.low_moves_armed|int != 1 or state.accepted_z_valid|int != 1 or "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_disarmed_during_camera_release_check
  {% elif (printer.gcode_move.homing_origin.z|float - state.accepted_z_offset|float)|abs > 0.0005 or printer.bed_mesh.profile_name|string != state.armed_mesh_profile|string %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_changed_during_camera_release_check
  {% elif (printer.extruder.temperature|float - owner.job_probe_nozzle|float)|abs > 5.0 or printer.heater_bed.temperature|float < 53.0 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=camera_release_check_temperature_drift
  {% else %}
    KCTRL_PRODUCTION_ASSERT_ARMED
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"first_layer_heating"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={printer.toolhead.estimated_print_time|float + 180.0}
    M104 S{owner.job_first_nozzle}
    M109 S{owner.job_first_nozzle}
    KCTRL_START_VISIBLE_PRIME_R4 FIRST_NOZZLE={owner.job_first_nozzle}
  {% endif %}

[gcode_macro KCTRL_START_VISIBLE_PRIME_R4]
description: One outside-bed prime line after the final geometry and route checks, then a blocking camera review
gcode:
  {% set box = printer.box %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set first_nozzle = params.FIRST_NOZZLE|float %}
  {% if box.state|string != "connect" or box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_changed_before_purge
  {% elif state.low_moves_armed|int != 1 or state.accepted_z_valid|int != 1 or "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_disarmed_before_purge
  {% elif (printer.gcode_move.homing_origin.z|float - state.accepted_z_offset|float)|abs > 0.0005 or printer.bed_mesh.profile_name|string != state.armed_mesh_profile|string %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_changed_before_purge
  {% elif (printer.extruder.temperature|float - first_nozzle)|abs > 5.0 or printer.heater_bed.temperature|float < 53.0 %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=explicit_print_temperature_not_reached
  {% else %}
    KCTRL_PRODUCTION_ASSERT_ARMED
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"visible_purge"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 60.0}
    SAVE_GCODE_STATE NAME=KCTRL_START_PRIME_R4
    G90
    M83
    G1 Z5 F1200
    G1 X-1.7 Y20 F6000
    G1 Z0.30 F600
    G1 Y150 E10 F3000
    G1 X-1.3 Y150 F3000
    G1 Y20 E10 F3000
    G1 Y10 F3000
    G1 E-1.2 F1800
    G1 Z5 F1200
    RESTORE_GCODE_STATE NAME=KCTRL_START_PRIME_R4 MOVE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"camera_prime_check"'
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE={now + 300.0}
  {% endif %}

[gcode_macro KCTRL_CONFIRM_CAMERA_PRIME_AND_RESUME_R4]
description: Resume model G-code only after the camera proves the outside-bed prime line and a clean nozzle
gcode:
  {% set box = printer.box %}
  {% set state = printer["gcode_macro KCTRL_STATE"] %}
  {% set owner = printer["gcode_macro KCTRL_START_OWNER_STATE"] %}
  {% if printer.print_stats.state|string != "paused" or printer.pause_resume.is_paused|lower != "true" %}
    {action_raise_error("K1 Control: camera prime confirmation requires the held print")}
  {% elif owner.phase|string != "camera_prime_check" or owner.watchdog_armed|int != 1 %}
    {action_raise_error("K1 Control: camera prime confirmation is not expected")}
  {% elif box.state|string != "connect" or box.t_command|string != "" or box.T1.filament|string != "A" or box.T2.filament|string not in ["None", "none", ""] %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=route_changed_during_camera_prime_check
  {% elif state.low_moves_armed|int != 1 or state.accepted_z_valid|int != 1 or "xyz" not in printer.toolhead.homed_axes %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_disarmed_during_camera_prime_check
  {% elif (printer.gcode_move.homing_origin.z|float - state.accepted_z_offset|float)|abs > 0.0005 or printer.bed_mesh.profile_name|string != state.armed_mesh_profile|string %}
    KCTRL_START_FAIL_AFTER_HEAT_V1 CODE=geometry_changed_during_camera_prime_check
  {% else %}
    UPDATE_DELAYED_GCODE ID=KCTRL_START_WATCHDOG_V1 DURATION=0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_armed VALUE=0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=watchdog_deadline VALUE=0.0
    SET_GCODE_VARIABLE MACRO=KCTRL_START_OWNER_STATE VARIABLE=phase VALUE='"model_ready"'
    RESUME_BASE
  {% endif %}
