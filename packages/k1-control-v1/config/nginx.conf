# K1-CONTROL-V1 offline candidate. Dedicated port; stock web config untouched.
worker_processes 1;
pid /var/run/k1-control-nginx.pid;
error_log /usr/data/k1-control-v1/logs/nginx-error.log warn;

events {
    worker_connections 128;
}

http {
    include /usr/data/k1-control-v1/current/nginx/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream k1_moonraker {
        server 127.0.0.1:7125;
    }

    server {
        listen 4409;
        server_name _;
        root /usr/data/k1-control-v1/current/www/mainsail;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        location /websocket {
            proxy_pass http://k1_moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/(access|api|machine|printer|server)/ {
            proxy_pass http://k1_moonraker;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
