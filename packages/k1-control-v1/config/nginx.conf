# K1-CONTROL-V1 offline candidate. Dedicated port; stock web config untouched.
worker_processes 1;
pid /var/run/k1-control-nginx.pid;
error_log syslog:server=unix:/dev/log,facility=local7,tag=k1_control warn;

events {
    worker_connections 128;
}

http {
    include /usr/data/k1-control-v1/current/nginx/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 100m;
    client_body_temp_path /usr/data/k1-control-v1/tmp/nginx-client-body 1 2;
    proxy_temp_path /usr/data/k1-control-v1/tmp/nginx-proxy 1 2;
    fastcgi_temp_path /usr/data/k1-control-v1/tmp/nginx-fastcgi 1 2;
    uwsgi_temp_path /usr/data/k1-control-v1/tmp/nginx-uwsgi 1 2;
    scgi_temp_path /usr/data/k1-control-v1/tmp/nginx-scgi 1 2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream k1_moonraker {
        server 127.0.0.1:7125;
    }

    server {
        listen 0.0.0.0:4409;
        server_name _;
        root /usr/data/k1-control-v1/current/www/mainsail;
        index index.html;

        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        auth_basic "K1 Max Control";
        auth_basic_user_file /usr/data/k1-control-v1/state/nginx.htpasswd;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        location /websocket {
            proxy_pass http://k1_moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization "";
        }

        location ~ ^/(access|api|machine|printer|server)/ {
            proxy_pass http://k1_moonraker;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization "";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
