# K1 Control - garde Z de la zone de service CFS - v1
#
# Pourquoi : le 2026-09-09 la routine de rechargement du CFS a demande
# Z -18.951 en X 185.5 / Y 291.5, derriere le plateau. Klipper a refuse
# celui-la (position_min vaut -10), mais tout Z entre -10 et 0 passe, et un Z
# negatif la-bas fait monter le plateau au-dessus du plan de la buse : c'est le
# coincement de la tete dans la goulotte de purge.
#
# La routine est compilee dans box_wrapper.so. Elle ne se desactive pas. Le
# garde se place donc sous elle, dans ToolHead.move.
#
# Y >= 296 est hors d'atteinte d'un fichier tranche : [stepper_y] declare
# gcode_position_max: 295. Le garde ne peut donc pas gener une impression, une
# palpation, un mesh ou une prise d'origine.

[kctrl_zone_guard]
zone_y_min: 296.0
z_floor: 0.0
action: refuse
enable: True

# ---------------------------------------------------------------------------
# Bouchon SET_HOTEND_FAN - DESACTIVE VOLONTAIREMENT
#
# La meme routine CFS appelle SET_HOTEND_FAN, une commande fournie uniquement
# par prtouch_v3. Cette machine est en [prtouch_v2] (printer.cfg ligne 319),
# donc la commande n'existe pas et Klipper met l'impression en pause sur
# key61 "Unknown command:SET_HOTEND_FAN". C'est un defaut d'usine.
#
# Le bouchon ci-dessous le corrigerait. Il reste commente tant que le garde Z
# ci-dessus n'a pas ete vu se declencher pour de vrai : aujourd'hui, cette
# commande manquante arrete la routine avant qu'elle n'atteigne son Z fautif.
# C'est un filet accidentel, mais c'est le seul qui ait deja fonctionne. On ne
# le retire qu'une fois le filet volontaire prouve sur la machine.
#
# [gcode_macro SET_HOTEND_FAN]
# description: Bouchon prtouch_v3 absent en prtouch_v2 - ne bouge rien
# gcode:
#   # [heater_fan hotend_fan] est pilote par la temperature de la buse : il n'y
#   # a rien a forcer, et rien a eteindre sans risque. On note l'appel et on
#   # rend la main.
#   {action_respond_info("K1 Control: SET_HOTEND_FAN ignore (prtouch_v2), VALUE=%s" % (params.VALUE|default("?")))}
